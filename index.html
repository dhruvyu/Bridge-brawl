let AC=null, muted=false, musicOn=true, sfxOn=true, _lastHit=0;
function actx(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function resumeAC(){ const a=actx(); if(a&&a.state==='suspended'){ try{a.resume();}catch(e){} } refreshAudio(); return a; }
function beep(freq,dur,type,vol){
  if(muted||!sfxOn) return; const a=actx(); if(!a) return;
  try{
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.value=freq; g.gain.value=(vol||0.06);
    o.connect(g); g.connect(a.destination);
    const t=a.currentTime; g.gain.setValueAtTime(g.gain.value,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.1));
    o.start(t); o.stop(t+(dur||0.1)+0.02);
  }catch(e){}
}
const S={
  deploy:()=>beep(430,0.09,'triangle',0.07),
  hit:(dmg)=>{ const t=performance.now(); if(t-_lastHit<30) return; _lastHit=t;
    if((dmg||0)>=120){ beep(78,0.17,'square',0.10); beep(150,0.09,'triangle',0.05); }
    else beep(200+Math.random()*45,0.05,'triangle',0.035); },
  spell:(heavy)=>{ if(heavy){ beep(90,0.34,'sawtooth',0.10); beep(180,0.12,'square',0.05); } else beep(150,0.2,'sawtooth',0.07); },

  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'triangle',0.09),i*140)),

};
const Music={
  a:null, master:null, padF:null, delay:null, timer:null, step:0, chord:0,
  stepMs:270, ticksPerChord:8,
  prog:[ {root:0,tones:[0,3,7]}, {root:-4,tones:[-4,0,3]}, {root:3,tones:[3,7,10]}, {root:-2,tones:[-2,2,5]} ],
  init(){
    const a=actx(); if(!a||this.a) return;
    try{
      const master=a.createGain(); master.gain.value=0;
      const comp=a.createDynamicsCompressor();
      comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=4; comp.attack.value=0.005; comp.release.value=0.25;
      master.connect(comp); comp.connect(a.destination);
      const padF=a.createBiquadFilter(); padF.type='lowpass'; padF.frequency.value=2400; padF.Q.value=0.4; padF.connect(master);
      const delay=a.createDelay(); delay.delayTime.value=0.30;
      const fb=a.createGain(); fb.gain.value=0.30; delay.connect(fb); fb.connect(delay); delay.connect(master);
      this.a=a; this.master=master; this.padF=padF; this.delay=delay; this.step=0; this.chord=this.prog.length-1;
    }catch(e){ this.a=null; }
  },
  note(dest,type,freq,t,dur,peak,atk,rel){
    const a=this.a, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(dest);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(peak,t+atk);
    if(dur-rel>atk) g.gain.setValueAtTime(peak,t+dur-rel);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.03);
  },
  chordAt(i){
    const a=this.a, t=a.currentTime, c=this.prog[i], dur=(this.stepMs*this.ticksPerChord)/1000;
    c.tones.forEach(s=>{ this.note(this.padF,'triangle',220*Math.pow(2,s/12),t,dur,0.085,0.35,0.6); });
    this.note(this.master,'sine',110*Math.pow(2,c.root/12),t,dur,0.16,0.05,0.4);
    this.note(this.master,'triangle',55*Math.pow(2,c.root/12),t,dur,0.06,0.06,0.4);
  },
  arpAt(){
    const c=this.prog[this.chord];
    const pat=[c.tones[0],c.tones[1],c.tones[2],c.tones[0]+12,c.tones[2],c.tones[1],c.tones[0]+12,c.tones[2]];
    const s=pat[this.step%pat.length], a=this.a, t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type='triangle'; o.frequency.value=440*Math.pow(2,s/12); o.connect(g); g.connect(this.master); g.connect(this.delay);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.06,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.32); o.start(t); o.stop(t+0.36);
  },
  tick(){ if(!this.a) return;
    if(this.step%this.ticksPerChord===0){ this.chord=(this.chord+1)%this.prog.length; this.chordAt(this.chord); }
    this.arpAt(); this.step++; },
  start(){ this.init(); refreshAudio(); },
  ensureRunning(){ if(this.a&&!this.timer){ this.timer=setInterval(()=>this.tick(),this.stepMs); this.tick(); } },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  setLevel(v){ if(!this.a) return; try{ this.master.gain.setTargetAtTime(v,this.a.currentTime,0.4); }catch(e){} }
};
function refreshAudio(){
  const on=!muted&&musicOn;
  const lvl=on?(state==='playing'?0.6:state==='paused'?0.22:state==='over'?0.36:0.30):0;
  Music.setLevel(lvl);
  if(lvl>0) Music.ensureRunning(); else Music.stop();
}
document.getElementById('mute').addEventListener('click',()=>{

/* ----------------------------- STORAGE ----------------------------- */
const STORE_KEY='bridgeBrawl_v2';
let stats={wins:0,losses:0,draws:0,crowns:0,games:0,history:[],deck:DEFAULT_DECK.slice(),difficulty:'medium',
  gold:0, unlocked:DEFAULT_DECK.slice(), copies:{}, levels:{}, chests:[]};
function loadStats(){
  try{
    const s=localStorage.getItem(STORE_KEY);
    if(s){ const p=JSON.parse(s); if(p&&typeof p==='object') stats=Object.assign(stats,p); }
  }catch(e){}
  // migration: saves from before the collection system
  if(!Array.isArray(stats.unlocked)||!stats.unlocked.length) stats.unlocked=DEFAULT_DECK.slice();
  stats.unlocked=stats.unlocked.filter(k=>CARDS[k]);
  if(typeof stats.gold!=='number') stats.gold=0;
  if(!stats.copies||typeof stats.copies!=='object') stats.copies={};
  if(!stats.levels||typeof stats.levels!=='object') stats.levels={};
  if(!Array.isArray(stats.chests)) stats.chests=[];
  if(!Array.isArray(stats.deck)) stats.deck=DEFAULT_DECK.slice();
  stats.deck=stats.deck.filter(k=>CARDS[k]&&isUnlocked(k));
  if(stats.deck.length<8){                       // pad from whatever is unlocked
    for(const k of stats.unlocked){ if(stats.deck.length>=8) break; if(stats.deck.indexOf(k)<0) stats.deck.push(k); }
  }
  if(stats.deck.length>8) stats.deck=stats.deck.slice(0,8);
  difficulty=AI_LEVELS[stats.difficulty]?stats.difficulty:'medium';
}
function saveStats(){ try{ stats.difficulty=difficulty; localStorage.setItem(STORE_KEY,JSON.stringify(stats)); }catch(e){} }
let lastReward=null;
function recordResult(r){
  if(r==='desync') return;
  const me=MYTEAM(), my=crownCount(me), foe=crownCount(-me);
  lastReward=null;
  const tier=chestForResult(r,my);
  if(tier){
    lastReward = grantChest(tier) ? {tier} : {tier, full:true};
  } else if(my>0){
    const g=8*my; stats.gold=(stats.gold||0)+g; lastReward={gold:g};
  }
  stats.games++; stats.crowns+=my;
  if(r==='victory') stats.wins++; else if(r==='defeat') stats.losses++; else stats.draws++;
  stats.history.unshift({r,my,foe,d:Net.on?'online':difficulty,t:Date.now()});
  if(stats.history.length>20) stats.history.length=20;
  saveStats();
}
function recordDesync(){}
function resetStats(){          // clears record only — keeps your collection
  stats.wins=0; stats.losses=0; stats.draws=0; stats.crowns=0; stats.games=0; stats.history=[];
  saveStats();
}

/* --------------------- COLLECTION & CHESTS ------------------------- */
const CHESTS = {
  wood:  {name:'Wooden Chest', color:'#a8763f', gold:[15,30],  copies:[4,8],   spread:[1,2], newCard:0.12, cost:60},
  silver:{name:'Silver Chest', color:'#c2cad6', gold:[40,75],  copies:[10,18], spread:[2,3], newCard:0.42, cost:180},
  gold:  {name:'Golden Chest', color:'#e9c86a', gold:[95,160], copies:[24,36], spread:[3,4], newCard:1.00, cost:450},
};
const LV_REQ   = [0,2,4,10,20];      // copies needed to leave level n
const LV_MAX   = 5;
const LV_SCALE = 0.07;               // +7% hp/dmg per level above 1
const LEVELS_ONLINE = true;          // false -> all cards forced to level 1 in PvP
const MAX_CHESTS = 6;

function isUnlocked(k){ return stats.unlocked.indexOf(k)>=0; }
function cardLevel(k){ return Math.min(LV_MAX, stats.levels[k]||1); }
function copiesNeeded(lv){ return LV_REQ[lv]||0; }
function shufflePlain(a){                       // Math.random — never touches the sim RNG
  a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function addCopies(k,n){
  stats.copies[k]=(stats.copies[k]||0)+n;
  let lv=cardLevel(k), ups=0;
  while(lv<LV_MAX && stats.copies[k]>=LV_REQ[lv]){ stats.copies[k]-=LV_REQ[lv]; lv++; ups++; }
  stats.levels[k]=lv;
  return ups;
}
function myLevels(){
  const o={}; for(const k of POOL){ const l=cardLevel(k); if(l>1) o[k]=l; } return o;
}
function scaleCard(c,lv){
  if(!lv||lv<=1) return c;
  const m=1+(lv-1)*LV_SCALE, o=Object.assign({},c);
  if(o.hp)  o.hp =Math.round(o.hp*m);
  if(o.dmg) o.dmg=Math.round(o.dmg*m);
  return o;
}
function buildSideCards(side,levels){
  side.lv=levels||{}; side.cards={};
  for(const k of POOL) side.cards[k]=scaleCard(CARDS[k], side.lv[k]||1);
}
function chestForResult(r,myCrowns){
  if(r!=='victory') return null;
  if(myCrowns>=3) return 'gold';
  if(myCrowns>=2) return 'silver';
  return 'wood';
}
function grantChest(tier){
  if(!tier) return false;
  if(stats.chests.length>=MAX_CHESTS) return false;
  stats.chests.push(tier); saveStats(); return true;
}
function openChest(tier){
  const c=CHESTS[tier];
  const out={tier, gold:0, cards:{}, unlocked:[], levelUps:{}};
  out.gold=c.gold[0]+((Math.random()*(c.gold[1]-c.gold[0]+1))|0);
  stats.gold=(stats.gold||0)+out.gold;

  const locked=POOL.filter(k=>!isUnlocked(k));
  if(locked.length && Math.random()<c.newCard){
    const k=locked[(Math.random()*locked.length)|0];
    stats.unlocked.push(k); out.unlocked.push(k);
    stats.levels[k]=stats.levels[k]||1;
  }
  let total=c.copies[0]+((Math.random()*(c.copies[1]-c.copies[0]+1))|0);
  const pool=shufflePlain(stats.unlocked.filter(k=>cardLevel(k)<LV_MAX || true));
  const want=c.spread[0]+((Math.random()*(c.spread[1]-c.spread[0]+1))|0);
  const picks=pool.slice(0,Math.max(1,Math.min(want,pool.length)));
  picks.forEach((k,i)=>{
    const share=(i===picks.length-1)?total:Math.max(1,Math.round(total/(picks.length-i)));
    total-=share;
    out.cards[k]=(out.cards[k]||0)+share;
    const ups=addCopies(k,share);
    if(ups) out.levelUps[k]=ups;
  });
  saveStats();
  return out;
}
function buyChest(tier){
  const c=CHESTS[tier];
  if((stats.gold||0)<c.cost) return 'Not enough gold';
  if(stats.chests.length>=MAX_CHESTS) return 'Chest slots are full';
  stats.gold-=c.cost; stats.chests.push(tier); saveStats(); return null;
}


const clamp=(v,a,b)=>v<a?a:v>b?b:v;
/* ------------------- DETERMINISM CORE (netcode-ready) ---------------
   Everything the simulation touches must be reproducible from
   (seed + ordered command list). Cosmetic randomness deliberately
   stays on Math.random() so it never perturbs the sim stream —
   particles/shake/audio differ per device and that's fine.
   ------------------------------------------------------------------- */
let simState=1;
function seedSim(s){ simState=(s>>>0)||1; }
function srand(){                                   // mulberry32
  simState=(simState+0x6D2B79F5)|0;
  let t=Math.imul(simState^(simState>>>15), 1|simState);
  t=(t+Math.imul(t^(t>>>7), 61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}
/* IEEE-754 sqrt is bit-identical across engines; Math.hypot is not. */
const dist=(ax,ay,bx,by)=>{ const dx=ax-bx, dy=ay-by; return Math.sqrt(dx*dx+dy*dy); };
const len2=(x,y)=>Math.sqrt(x*x+y*y);
function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){ const j=(srand()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ---- Lockstep command queue ----
   No gameplay action mutates state directly. Inputs become commands
   scheduled for a future tick, so a remote player's commands can be
   injected the same way with zero further restructuring. */
let tick=0, cmdQueue=[], cmdSeq=0;
let INPUT_DELAY=0;                 // ticks; raise for online play
function queueCommand(c){ c.seq=cmdSeq++; cmdQueue.push(c); return c; }
function issueDeploy(team,slot,x,y){
  return queueCommand({tick:tick+INPUT_DELAY, type:'deploy', team, slot, x, y});
}
function applyDueCommands(){
  if(!cmdQueue.length) return;
  const due=[];
  for(let i=0;i<cmdQueue.length;i++) if(cmdQueue[i].tick<=tick) due.push(cmdQueue[i]);
  if(!due.length) return;
  // strict ordering so both peers execute identically
  due.sort((a,b)=>(a.tick-b.tick)||(a.team-b.team)||(a.seq-b.seq));
  for(const c of due) execCommand(c);
  cmdQueue=cmdQueue.filter(c=>c.tick>tick);
}
function execCommand(c){
  if(c.type!=='deploy') return;
  const side=c.team===1?player:enemy;
  const key=side.hand[c.slot];
  if(!key) return;
  const card=CARDS[key];
  if(side.elixir<card.cost) return;          // re-validated at exec time on both peers
  side.elixir-=card.cost;
  const played=playFromHand(side,c.slot);
  spawnCard(side,played,c.x,c.y);
}

/* ---- Desync detection: cheap rolling checksum of simulation state ---- */
function stateChecksum(){
  let h=2166136261>>>0;
  const mix=v=>{ h=(h^(v|0))>>>0; h=Math.imul(h,16777619)>>>0; };
  mix(tick);
  for(let i=0;i<units.length;i++){
    const u=units[i];
    mix(u.id); mix(u.team); mix(u.x*512); mix(u.y*512); mix(u.hp*4); mix(u.deploy*256);
  }
  for(let i=0;i<towers.length;i++){ const t=towers[i]; mix(t.hp*4); mix(t.alive?1:0); }
  mix(player.elixir*256); mix(enemy.elixir*256);
  return h>>>0;
}
function sx(x){return arenaX+x*tile;}
function sy(y){return arenaY+(FLIP()?(TY-y):y)*tile;}
function toArena(px,py){const ry=(py-arenaY)/tile; return {x:(px-arenaX)/tile, y:FLIP()?(TY-ry):ry};}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r*f),0,255);g=clamp(Math.round(g*f),0,255);b=clamp(Math.round(b*f),0,255);
  return `rgb(${r},${g},${b})`;
}
function addShake(m){ shake=Math.min(16,Math.max(shake,m)); }
const nearestBridge=x=>Math.abs(x-BR_L)<Math.abs(x-BR_R)?BR_L:BR_R;
const onBridge=x=>Math.abs(x-BR_L)<=BRIDGE_HALF||Math.abs(x-BR_R)<=BRIDGE_HALF;
const inRiver=y=>Math.abs(y-RIVER)<0.95;

/* ----------------------------- LAYOUT ------------------------------ */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  TOP_H=Math.round(clamp(H*0.062,42,60));
  HUD_H=Math.round(clamp(H*0.20,128,186));
  const availH=H-TOP_H-HUD_H;
  tile=Math.min(W/TX,availH/TY);
  arenaW=tile*TX; arenaH=tile*TY;
  arenaX=(W-arenaW)/2; arenaY=TOP_H+(availH-arenaH)/2;
  buildBg(); buildSpriteCaches();
}

/* --------------------------- BG CACHE ------------------------------ */
function buildBg(){
  bg=document.createElement('canvas');
  bg.width=Math.round(arenaW*DPR); bg.height=Math.round(arenaH*DPR);
  const g=bg.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  const T=tile;
  for(let r=0;r<TY;r++){ g.fillStyle=(r%2===0)?COL.grassA:COL.grassB; g.fillRect(0,r*T,arenaW,T); }
  g.globalAlpha=0.10;
  for(let i=0;i<160;i++){
    const rx=Math.random()*arenaW, ry=Math.random()*arenaH;
    if(Math.abs(ry/T-RIVER)<1.1) continue;
    g.fillStyle=Math.random()<0.5?'#7cc25a':'#4c8c39'; g.fillRect(rx,ry,T*0.16,T*0.16);
  }
  g.globalAlpha=1;
  g.strokeStyle=COL.grassEdge; g.lineWidth=Math.max(2,T*0.12);
  g.strokeRect(g.lineWidth/2,g.lineWidth/2,arenaW-g.lineWidth,arenaH-g.lineWidth);
  const ry0=(RIVER-0.9)*T, rh=1.8*T;
  g.fillStyle=COL.water; g.fillRect(0,ry0,arenaW,rh);
  g.fillStyle=COL.waterHi; g.globalAlpha=0.5;
  for(let i=0;i<26;i++) g.fillRect(Math.random()*arenaW,ry0+Math.random()*rh,T*0.5,T*0.09);
  g.globalAlpha=1;
  g.fillStyle=COL.grassEdge; g.fillRect(0,ry0-T*0.14,arenaW,T*0.14); g.fillRect(0,ry0+rh,arenaW,T*0.14);
  [BR_L,BR_R].forEach(bx=>{
    const w=(BRIDGE_HALF*2+0.26)*T, x=bx*T-w/2;
    g.fillStyle=COL.woodDk; g.fillRect(x,ry0-T*0.2,w,rh+T*0.4);
    g.fillStyle=COL.wood;
    for(let p=0;p<9;p++) g.fillRect(x,ry0-T*0.2+p*(rh+T*0.4)/9,w,(rh+T*0.4)/9*0.7);
    g.strokeStyle=COL.woodDk; g.lineWidth=Math.max(1,T*0.05); g.strokeRect(x,ry0-T*0.2,w,rh+T*0.4);
  });
  for(const k in TOWERS_DEF){ const t=TOWERS_DEF[k];
    g.fillStyle='rgba(0,0,0,0.08)';
    g.beginPath(); g.ellipse(t.x*T,(t.y+(t.king?0.9:0.8))*T,T*(t.king?1.5:1.25),T*0.5,0,0,7); g.fill(); }
}

/* ------------------------- SPRITE CACHE ---------------------------- */
function mkCanvas(cssW,cssH){
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.ceil(cssW*DPR)); c.height=Math.max(1,Math.ceil(cssH*DPR));
  const g=c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  return {canvas:c,g,cw:cssW,ch:cssH};
}
function buildSpriteCaches(){
  UNIT_SPR={}; GROUND_SPR={};
  const T=tile;
  for(const key of UNIT_TYPES){
    const c=CARDS[key], draw=c.draw, R=c.radius*T;
    for(const team of [1,-1]){
      const gs=mkCanvas(R*2.8,R*2.8);
      gs.g.translate(gs.cw/2,gs.ch/2); paintGround(gs.g,R,team,T);
      GROUND_SPR[draw+'_'+team]=gs;
      for(const st of [0,1]){
        const bs=mkCanvas(R*4.4,R*5.0);
        bs.g.translate(bs.cw/2,bs.ch/2);
        paintUnitBody(bs.g,draw,R,team,c.color,st===1);
        UNIT_SPR[draw+'_'+team+'_'+st]=bs;
      }
    }
  }
  buildTowerSprites();
  buildCardFaces();
  buildCrest();
  VIGNETTE=null;
}

/* Towers were ~36 rounded-rects per frame; now one blit each. */
let TOWER_SPR={};
function buildTowerSprites(){
  TOWER_SPR={};
  const T=tile;
  for(const team of [1,-1]) for(const king of [0,1]) for(const alive of [0,1]){
    const w=(king?2.4:1.9)*T, h=(king?2.6:2.1)*T;
    const cw=w+T*1.2, ch=h+T*1.9;
    const s=mkCanvas(cw,ch);
    s.g.translate(cw/2, ch-h*0.38-T*0.5);   // origin = tower centre point
    paintTower(s.g,team,!!king,!!alive,T);
    TOWER_SPR[team+'_'+king+'_'+alive]={c:s,ox:cw/2,oy:ch-h*0.38-T*0.5};
  }
}
function paintTower(g,team,king,alive,T){
  const base=team===1?COL.pTower:COL.eTower;
  const dk=shade(base,0.58), md=shade(base,0.8), lt=shade(base,1.22);
  const w=(king?2.4:1.9)*T, h=(king?2.6:2.1)*T, x=-w/2, y=-h*0.62;
  if(!alive){
    g.fillStyle='rgba(0,0,0,0.20)';
    g.beginPath(); g.ellipse(0,h*0.30,w*0.55,h*0.13,0,0,7); g.fill();
    g.fillStyle='#4a4038'; rr(g,x+w*0.08,y+h*0.55,w*0.84,h*0.42,6); g.fill();
    g.fillStyle='#332b25';
    for(let i=0;i<6;i++) g.fillRect(x+w*0.12+i*w*0.14, y+h*0.60+((i%2)*h*0.13), w*0.11, h*0.15);
    g.fillStyle=shade(base,0.35);
    for(let i=0;i<4;i++) g.fillRect(x+w*0.18+i*w*0.19, y+h*0.90, w*0.10, h*0.07);
    return;
  }
  g.fillStyle='rgba(0,0,0,0.20)';
  g.beginPath(); g.ellipse(0,h*0.32,w*0.56,h*0.14,0,0,7); g.fill();
  // plinth
  g.fillStyle=dk; rr(g,x-T*0.10,y+h*0.86,w+T*0.20,h*0.16,T*0.10); g.fill();
  // body with vertical shading
  const grad=g.createLinearGradient(x,0,x+w,0);
  grad.addColorStop(0,dk); grad.addColorStop(0.35,base); grad.addColorStop(0.72,lt); grad.addColorStop(1,md);
  g.fillStyle=dk; rr(g,x,y,w,h,T*0.22); g.fill();
  g.fillStyle=grad; rr(g,x+w*0.07,y+h*0.05,w*0.86,h*0.9,T*0.19); g.fill();
  // stone courses
  g.strokeStyle='rgba(0,0,0,0.16)'; g.lineWidth=Math.max(1,T*0.045);
  for(let i=1;i<5;i++){ const yy=y+h*0.05+i*h*0.17;
    g.beginPath(); g.moveTo(x+w*0.09,yy); g.lineTo(x+w*0.91,yy); g.stroke(); }
  for(let i=0;i<4;i++){ const xx=x+w*0.09+((i+0.5)/4)*w*0.82;
    g.beginPath(); g.moveTo(xx,y+h*0.05); g.lineTo(xx,y+h*0.22); g.stroke(); }
  // battlements
  g.fillStyle=dk; const merl=w/5;
  for(let i=0;i<5;i++) if(i%2===0) rr(g,x+i*merl,y-T*0.30,merl,T*0.44,T*0.06), g.fill();
  g.fillStyle=md; g.fillRect(x,y-T*0.02,w,T*0.10);
  // window / hearth
  g.fillStyle='#20242c'; rr(g,-w*0.15,y+h*0.30,w*0.30,h*0.30,T*0.09); g.fill();
  g.fillStyle=king?'#ffe14d':shade(base,1.45);
  rr(g,-w*0.11,y+h*0.34,w*0.22,h*0.21,T*0.07); g.fill();
  // banner
  g.fillStyle=shade(base,1.35);
  g.beginPath(); g.moveTo(-w*0.13,y+h*0.66); g.lineTo(w*0.13,y+h*0.66);
  g.lineTo(w*0.13,y+h*0.90); g.lineTo(0,y+h*0.82); g.lineTo(-w*0.13,y+h*0.90); g.closePath(); g.fill();
  if(king){
    g.fillStyle='#ffd23c'; const cy=y-T*0.36;
    g.beginPath(); g.moveTo(-w*0.21,cy); g.lineTo(-w*0.21,cy-T*0.42); g.lineTo(-w*0.08,cy-T*0.12);
    g.lineTo(0,cy-T*0.54); g.lineTo(w*0.08,cy-T*0.12); g.lineTo(w*0.21,cy-T*0.42); g.lineTo(w*0.21,cy);
    g.closePath(); g.fill();
    g.fillStyle='#b8912a'; g.fillRect(-w*0.21,cy,w*0.42,T*0.09);
  }
}

/* Card faces: cached once at a reference size, blitted and scaled. */
let CARDFACE={};
const CF_W=168, CF_H=214;
function buildCardFaces(){
  CARDFACE={};
  for(const key of POOL){
    const s=mkCanvas(CF_W,CF_H);
    paintCardFace(s.g,CARDS[key],CF_W,CF_H);
    CARDFACE[key]=s;
  }
}
function paintCardFace(g,c,w,h){
  const isSpell=c.type==='spell', isBld=c.type==='building';
  const edge=isSpell?'#b98ad6':(isBld?'#8fb0c9':'#efe0b8');
  g.fillStyle=shade(edge,0.72); rr(g,0,0,w,h,13); g.fill();
  g.fillStyle=edge; rr(g,1.5,1.5,w-3,h-3,12); g.fill();
  const bg=g.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,shade(c.color,1.18)); bg.addColorStop(0.55,c.color); bg.addColorStop(1,shade(c.color,0.62));
  g.fillStyle=bg; rr(g,5,5,w-10,h-10,10); g.fill();
  g.fillStyle='rgba(255,255,255,0.16)'; rr(g,7,7,w-14,h*0.34,8); g.fill();
  g.fillStyle='rgba(0,0,0,0.26)'; rr(g,5,h*0.60,w-10,h*0.40-5,9); g.fill();
  g.save(); g.translate(w/2,h*0.36); g.scale(1.12,1.12);
  paintCardArt(g,c,Math.min(w,h)*0.30); g.restore();
  g.fillStyle='#12161c'; g.font=`bold ${Math.round(h*0.078)}px "Trebuchet MS",system-ui`;
  g.textAlign='center'; g.textBaseline='middle';
  const words=c.name.split(' '); let line='',lines=[];
  for(const wd of words){ const t=line?line+' '+wd:wd;
    if(g.measureText(t).width>w*0.82&&line){ lines.push(line); line=wd; } else line=t; }
  if(line) lines.push(line);
  const y0=h*0.755-(lines.length-1)*h*0.045;
  lines.forEach((l,i)=>g.fillText(l,w/2,y0+i*h*0.09));
  const stripe=isSpell?'#8e5fb8':(isBld?'#5b7f9c':'#6b5a3a');
  g.fillStyle=stripe; rr(g,w*0.16,h*0.90,w*0.68,h*0.045,4); g.fill();
  const cr=w*0.165;
  g.fillStyle='rgba(0,0,0,0.35)'; g.beginPath(); g.arc(w-cr*0.85,cr*0.95,cr*1.02,0,7); g.fill();
  g.fillStyle=COL.elixir; g.beginPath(); g.arc(w-cr*0.9,cr*0.9,cr,0,7); g.fill();
  g.fillStyle=shade(COL.elixir,1.5); g.beginPath(); g.arc(w-cr*1.05,cr*0.72,cr*0.42,0,7); g.fill();
  g.fillStyle='#fff'; g.font=`bold ${Math.round(cr*1.25)}px "Trebuchet MS",system-ui`;
  g.fillText(c.cost,w-cr*0.9,cr*0.95);
}
function paintCardArt(g,c,r){
  if(c.type!=='spell'){
    const s=UNIT_SPR[c.draw+'_1_0'];
    if(s){ const sc=(r*2.5)/Math.max(s.cw,s.ch);
      g.drawImage(s.canvas,-s.cw*sc/2,-s.ch*sc/2,s.cw*sc,s.ch*sc); return; }
  }
  if(c.draw==='fireball'){
    const gg=g.createRadialGradient(0,0,r*0.1,0,0,r);
    gg.addColorStop(0,'#fff'); gg.addColorStop(0.5,'#ff9a3c'); gg.addColorStop(1,'#c22');
    g.fillStyle=gg; g.beginPath(); g.arc(0,0,r,0,7); g.fill();
  } else if(c.draw==='jolt'){
    g.fillStyle='#ffe14d'; g.beginPath();
    g.moveTo(-r*0.2,-r); g.lineTo(r*0.4,-r*0.1); g.lineTo(0,-r*0.1); g.lineTo(r*0.2,r);
    g.lineTo(-r*0.4,r*0.1); g.lineTo(0,r*0.1); g.closePath(); g.fill();
  } else if(c.draw==='frost'){
    g.strokeStyle='#eaf9ff'; g.lineWidth=r*0.16; g.lineCap='round';
    for(let i=0;i<3;i++){ const a=i*Math.PI/3;
      g.beginPath(); g.moveTo(-Math.cos(a)*r,-Math.sin(a)*r); g.lineTo(Math.cos(a)*r,Math.sin(a)*r); g.stroke(); }
    g.fillStyle=COL.frost; g.beginPath(); g.arc(0,0,r*0.3,0,7); g.fill();
  } else if(c.draw==='log'){
    g.fillStyle=COL.woodDk; rr(g,-r,-r*0.5,r*2,r,r*0.45); g.fill();
    g.fillStyle=COL.wood; rr(g,-r*0.92,-r*0.4,r*1.84,r*0.8,r*0.38); g.fill();
    g.strokeStyle=COL.woodDk; g.lineWidth=r*0.12;
    for(let i=-1;i<=1;i++){ g.beginPath(); g.moveTo(i*r*0.45,-r*0.4); g.lineTo(i*r*0.45,r*0.4); g.stroke(); }
  } else {
    g.fillStyle=shade(c.color,0.55); g.beginPath(); g.arc(0,0,r*0.9,0,7); g.fill();
  }
}
let CREST_SPR=null;
function buildCrest(){
  const s=Math.min(W,H)*0.16, cw=s*2.2, ch=s*3.0;
  const cv2=mkCanvas(cw,ch); const g=cv2.g;
  g.translate(cw/2,ch*0.42);
  g.fillStyle='#e9c86a'; g.beginPath();
  g.moveTo(-s*0.8,-s); g.lineTo(s*0.8,-s); g.lineTo(s*0.8,s*0.2);
  g.quadraticCurveTo(s*0.8,s*1.1,0,s*1.4); g.quadraticCurveTo(-s*0.8,s*1.1,-s*0.8,s*0.2); g.closePath(); g.fill();
  g.fillStyle=shade('#e9c86a',0.75); g.lineWidth=s*0.05;
  g.strokeStyle=shade('#e9c86a',0.6); g.stroke();
  g.fillStyle=COL.eTower; g.beginPath();
  g.moveTo(-s*0.62,-s*0.8); g.lineTo(0,-s*0.8); g.lineTo(0,s*1.15); g.quadraticCurveTo(-s*0.62,s*0.9,-s*0.62,s*0.1); g.closePath(); g.fill();
  g.fillStyle=COL.pTower; g.beginPath();
  g.moveTo(s*0.62,-s*0.8); g.lineTo(0,-s*0.8); g.lineTo(0,s*1.15); g.quadraticCurveTo(s*0.62,s*0.9,s*0.62,s*0.1); g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,0.14)';
  g.beginPath(); g.moveTo(-s*0.62,-s*0.8); g.lineTo(s*0.62,-s*0.8); g.lineTo(s*0.62,-s*0.3); g.lineTo(-s*0.62,-s*0.1); g.closePath(); g.fill();
  g.strokeStyle='#fff'; g.lineWidth=s*0.10; g.lineCap='round';
  g.beginPath(); g.moveTo(-s*0.4,s*0.5); g.lineTo(s*0.4,-s*0.4); g.stroke();
  g.beginPath(); g.moveTo(s*0.4,s*0.5); g.lineTo(-s*0.4,-s*0.4); g.stroke();
  CREST_SPR={c:cv2,cw,ch};
}
let VIGNETTE=null;
function getVignette(){
  if(VIGNETTE) return VIGNETTE;
  const g=ctx.createRadialGradient(W/2,arenaY+arenaH/2,Math.min(W,arenaH)*0.30,
                                   W/2,arenaY+arenaH/2,Math.max(W,arenaH)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.72,'rgba(0,0,0,0.12)'); g.addColorStop(1,'rgba(0,0,0,0.34)');
  VIGNETTE=g; return g;
}
function paintGround(g,R,team,T){
  g.fillStyle='rgba(0,0,0,0.22)';
  g.beginPath(); g.ellipse(0,R*0.55,R*0.95,R*0.42,0,0,7); g.fill();
  g.lineWidth=Math.max(2,T*0.09); g.strokeStyle=team===1?COL.pRing:COL.eRing;
  g.beginPath(); g.ellipse(0,R*0.55,R*0.92,R*0.4,0,0,7); g.stroke();
}
function paintUnitBody(g,draw,R,team,color,flash){
  const body=flash?'#ffffff':color;
  const bodyDk=flash?'#ffd0d0':shade(color,0.7);
  const teamCol=team===1?COL.pTower:COL.eTower;
  const ringCol=team===1?COL.pRing:COL.eRing;

/* ------------------------------ DECK ------------------------------- */
function makeSide(team,deck,levels){
  const q=shuffle(deck);
  const side={team, elixir:6, hand:q.slice(0,4), pending:q.slice(4,8), aiTimer:1.2};
  buildSideCards(side, levels);
  return side;
}
function playFromHand(side,slot){
  const played=side.hand[slot];
  side.hand[slot]=side.pending.shift(); side.pending.push(played);
  return played;
}

/* ------------------------------ MATCH ------------------------------ */
function startMatch(seed,deckA,deckB,lvA,lvB){
  seedSim(seed!=null?seed:(Date.now()>>>0));
  tick=0; cmdQueue=[]; cmdSeq=0;
  units=[]; projectiles=[]; rollers=[]; fx=[]; floaters=[]; towers=[]; uid=1; shake=0;
  matchTime=0; overtime=false; result=''; sel=-1; dragging=false;
  const dA=(Array.isArray(deckA)&&deckA.length===8)?deckA:((Array.isArray(stats.deck)&&stats.deck.length===8)?stats.deck:DEFAULT_DECK);
  const dB=(Array.isArray(deckB)&&deckB.length===8)?deckB:AI_DECKS[difficulty];
  const useLv = !Net.on || LEVELS_ONLINE;
  const mineLv = useLv ? (lvA||myLevels()) : {};
  const foeLv  = useLv ? (lvB||{}) : {};
  player=makeSide(1,dA,mineLv);
  enemy=makeSide(-1,dB,foeLv);
  for(const k in TOWERS_DEF){
    const d=TOWERS_DEF[k], st=d.king?TOWER_STATS.king:TOWER_STATS.princess;
    towers.push({key:k,x:d.x,y:d.y,team:d.team,king:d.king,
      hp:st.hp,maxHp:st.hp,dispHp:st.hp,dmg:st.dmg,atk:st.atk,range:st.range,
      cd:0,active:d.king?false:true,alive:true,isTower:true,radius:d.king?1.1:0.9});
  }
  state='playing'; Music.start(); refreshAudio();
}

/* ------------------------------ SPAWN ------------------------------ */
function spawnCard(side,cardKey,x,y){
  const c=(side.cards&&side.cards[cardKey])||CARDS[cardKey];
  if(c.type==='spell'){ castSpell(side.team,cardKey,x,y,c); return; }
  const n=c.count||1, positions=formation(n,x,y,side.team);
  const dep=deployTime(c);
  for(let i=0;i<n;i++){
    const p=positions[i];
    units.push({
      id:uid++, team:side.team, card:cardKey, name:c.name, draw:c.draw, color:c.color,
      x:p.x, y:p.y, vx:0, vy:0,
      hp:c.hp, maxHp:c.hp, dispHp:c.hp, dmg:c.dmg, atk:c.atk, cd:c.atk*0.4,
      range:c.range, speed:c.speed||0, targets:c.targets||'any',
      air:!!c.air, hitAir:!!c.hitAir, ranged:!!c.ranged, splash:c.splash||0, slowOnHit:c.slow||0, falloff:c.falloff||0,
      isBuilding:c.type==='building', life:c.life||0, maxLife:c.life||0,
      radius:c.radius, stun:0, slow:0, kbY:0, kbT:0, deploy:dep, maxDeploy:dep,
      target:null, retargetCd:0, hitFlash:0, lunge:0, walk:c.type==='building'?0:srand()*6.28,
    });
  }
  S.deploy();
  puff(sx(x),sy(y),side.team===1?COL.pRing:COL.eRing);
}
function formation(n,x,y,team){
  if(n===1) return [{x,y}];
  if(n===2) return [{x:x-0.3,y},{x:x+0.3,y}];
  const out=[];
  for(let i=0;i<n;i++){ const col=(i%2)?1:-1, rank=(i>>1)+1;
    out.push({x:x+col*rank*0.42, y:y+Math.floor(i/2)*0.5*(-team)}); }
  return out;
}
function castSpell(team,key,x,y,card){
  const c=card||CARDS[key];
  if(c.mode==='roll'){
    rollers.push({x, y, dir:-team, team, dmg:c.dmg, push:c.push, width:c.width,
      range:c.range, speed:c.rollSpeed, traveled:0, spin:0, hit:{}});
    S.roll(); addShake(3);
    return;
  }
  if(key==='frost') S.frost(); else S.spell(key==='fireball');
  addShake(key==='fireball'?7:3.5);
  fx.push({type:'spell',x,y,r:c.radius,t:0,dur:0.5,color:c.color,key});
  for(const u of units){
    if(u.team===team||u.dead) continue;
    if(dist(u.x,u.y,x,y)<=c.radius+u.radius){
      damageUnit(u,c.dmg); u.hitFlash=0.2;
      if(c.stun) u.stun=Math.max(u.stun,c.stun);
      if(c.slow) u.slow=Math.max(u.slow,c.slow);
    }
  }
  for(const t of towers){
    if(!t.alive||t.team===team) continue;
    if(dist(t.x,t.y,x,y)<=c.radius+t.radius) damageTower(t,c.dmg*0.35);
  }
}

/* ----------------------------- COMBAT ------------------------------ */
function spawnDamage(x,y,amt,opts){
  opts=opts||{};
  floaters.push({x,y,amt:Math.round(amt),t:0,dur:opts.dur||0.85,color:opts.color||'#ffffff',big:!!opts.big});
}
function damageUnit(u,amt){
  if(u.dead) return;
  u.hp-=amt; u.hitFlash=0.12;
  spawnDamage(u.x,u.y-0.4,amt,{color:amt>=150?'#ffd23c':'#ffffff',big:amt>=150});
  if(u.hp<=0){ u.dead=true; puff(sx(u.x),sy(u.y),'#444',0.5); }
}
function damageTower(t,amt){
  if(!t.alive) return;
  t.hp-=amt; if(t.king) t.active=true;
  spawnDamage(t.x,t.y-0.6,amt,{color:'#ffd23c',big:amt>=150});
  if(t.hp<=0) killTower(t);
}
function killTower(t){
  if(!t.alive) return;
  t.alive=false; t.hp=0; S.tower(); addShake(9);
  for(let i=0;i<18;i++) fx.push({type:'debris',x:t.x+(Math.random()-0.5)*1.6,y:t.y+(Math.random()-0.5)*1.6,
    vx:(Math.random()-0.5)*3,vy:-Math.random()*4-1,t:0,dur:0.9,color:t.team===1?COL.pTower:COL.eTower});
  if(!t.king){
    const king=towers.find(x=>x.key===(t.team===1?'pKing':'eKing'));
    if(king) king.active=true;
  }
}
function validTarget(u,e){
  if(e.dead||e.alive===false) return false;
  if(e.team===u.team) return false;
  if(u.targets==='units' && e.isTower) return false;
  if(u.targets==='buildings' && !e.isTower && !e.isBuilding) return false;
  if(e.air && !u.hitAir) return false;
  return true;
}
function acquire(u){
  const canTower = u.targets!=='units';
  if(u.targets==='buildings'){
    let best=null,bd=1e9;
    for(const e of units){ if(!e.isBuilding||!validTarget(u,e)) continue;
      const d=dist(u.x,u.y,e.x,e.y); if(d<bd){bd=d;best=e;} }
    for(const t of towers){ if(!validTarget(u,t)) continue;
      const d=dist(u.x,u.y,t.x,t.y); if(d<bd){bd=d;best=t;} }
    return best;
  }
  const aggro=u.ranged?6.5:5.5;
  let bu=null,bud=1e9;
  for(const e of units){ if(!validTarget(u,e)) continue;
    const d=dist(u.x,u.y,e.x,e.y); if(d<bud){bud=d;bu=e;} }
  if(bu && bud<=Math.max(aggro,u.range+1)) return bu;
  if(canTower){
    let bt=null,btd=1e9;
    for(const t of towers){ if(!validTarget(u,t)) continue;
      const d=dist(u.x,u.y,t.x,t.y); if(d<btd){btd=d;bt=t;} }
    if(bt) return bt;
  }
  return bu;
}

/* ---------------------------- STEERING -----------------------------
   Neighbor grid + seek/separation/funnel steering with smoothed velocity.
   Bridges are hard corridors so nobody gets squeezed onto the railings.
   ------------------------------------------------------------------- */
const GRID_W=TX+2;
let grid=new Map();
function gkey(gx,gy){ return (gy+1)*GRID_W+(gx+1); }
function buildGrid(){
  grid.clear();
  for(let i=0;i<units.length;i++){
    const u=units[i]; if(u.dead) continue;
    const k=gkey(u.x|0,u.y|0);
    let a=grid.get(k); if(!a){ a=[]; grid.set(k,a); }
    a.push(u);
  }
}
function forEachNeighbor(u,fn){
  const gx=u.x|0, gy=u.y|0;
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    const a=grid.get(gkey(gx+i,gy+j));
    if(a) for(let n=0;n<a.length;n++) fn(a[n]);
  }
}
function bridgeFor(u,t){
  const dl=Math.abs(u.x-BR_L)+0.6*Math.abs(t.x-BR_L);
  const dr=Math.abs(u.x-BR_R)+0.6*Math.abs(t.x-BR_R);
  return dl<=dr?BR_L:BR_R;
}
function pathPoint(u,t){
  if(u.air) return {x:t.x,y:t.y};
  const above=u.y<RIVER, tAbove=t.y<RIVER;
  if(above===tAbove) return {x:t.x,y:t.y};
  const bx=bridgeFor(u,t);
  const approach=RIVER+(above?-1.9:1.9);
  const exit=RIVER+(above?1.9:-1.9);
  if(Math.abs(u.x-bx)>0.4 && Math.abs(u.y-RIVER)>1.6) return {x:bx,y:approach};
  return {x:bx,y:exit};
}
function steerUnit(u,dt){
  const t=u.target; if(!t) return;
  const wp=pathPoint(u,t);
  let dx=wp.x-u.x, dy=wp.y-u.y; const d=len2(dx,dy)||1;
  let sxv=dx/d, syv=dy/d;

  // separation (only against same layer: ground vs ground, air vs air)
  let sepx=0, sepy=0, n=0;
  forEachNeighbor(u,o=>{
    if(o===u||o.dead||o.air!==u.air) return;
    if(o===u.target) return;              // never get pushed away from what you're attacking
    const ddx=u.x-o.x, ddy=u.y-o.y;
    const dd=len2(ddx,ddy);
    const mind=(u.radius+o.radius)*1.06;
    if(dd<mind && dd>0.0001){
      const w=(mind-dd)/mind*(o.isBuilding?1.7:1);
      sepx+=ddx/dd*w; sepy+=ddy/dd*w; n++;
    }
  });
  if(n){ sepx/=n; sepy/=n; }

  // bridge funnel — ONLY while a crossing is still required. Applying it to a
  // unit already on the target's side fights the seek force and can pin it.
  let fnx=0;
  if(!u.air && (u.y<RIVER)!==(t.y<RIVER)){
    const band=Math.abs(u.y-RIVER);
    if(band<2.6){
      const bx=nearestBridge(u.x);
      fnx=clamp(bx-u.x,-1,1)*(1-band/2.6)*1.8;
    }
  }

  let vx=sxv+sepx*1.9+fnx, vy=syv+sepy*1.9;
  const vl=len2(vx,vy)||1; vx/=vl; vy/=vl;
  const spd=u.speed*(u.slow>0?0.45:1);
  const turn=1-Math.exp(-11*dt);
  u.vx+=(vx*spd-u.vx)*turn;
  u.vy+=(vy*spd-u.vy)*turn;

  let px=u.x+u.vx*dt, py=u.y+u.vy*dt;
  if(!u.air){
    if(inRiver(py)&&!onBridge(px)){ py=u.y; }          // can't wade in
    if(inRiver(py)){                                    // on the bridge: stay on the deck
      const bx=nearestBridge(px);
      px=clamp(px,bx-BRIDGE_HALF,bx+BRIDGE_HALF);
    }
  }
  u.x=clamp(px,0.4,TX-0.4); u.y=clamp(py,0.4,TY-0.4);
  u.walk+=dt*len2(u.vx,u.vy)*6;
}
function applyKnockback(u,dt){
  u.kbT-=dt;
  let py=u.y+u.kbY*dt;
  if(!u.air){
    if(inRiver(py)&&!onBridge(u.x)) py=u.y;
    if(inRiver(py)){ const bx=nearestBridge(u.x); u.x=clamp(u.x,bx-BRIDGE_HALF,bx+BRIDGE_HALF); }
  }
  u.y=clamp(py,0.4,TY-0.4);
}
function unitAttack(u){
  const t=u.target; if(!t) return;
  if(dist(u.x,u.y,t.x,t.y)>u.range+u.radius+(t.radius||0.3)) return;
  if(u.cd>0) return;
  u.cd=u.atk*(u.slow>0?1.6:1);
  let dmg=u.dmg;
  if(u.falloff){                       // devastating point-blank, weak at the edge
    const d=dist(u.x,u.y,t.x,t.y), near=u.range*0.45;
    const f = d<=near ? 1 : clamp(1-((d-near)/(u.range-near))*(1-u.falloff), u.falloff, 1);
    dmg=Math.round(dmg*f);
  }
  if(u.ranged){
    projectiles.push({x:u.x,y:u.y,tx:t.x,ty:t.y,target:t,team:u.team,
      dmg:dmg,splash:u.splash,slow:u.slowOnHit,hitAir:u.hitAir,speed:9,color:u.color,r:0.22,kind:u.draw});
  } else { dealHit(u,t,dmg); u.lunge=0.12; S.hit(dmg); }
}
function dealHit(src,t,dmg){
  if(src.splash){
    for(const o of units){
      if(o.team===src.team||o.dead) continue;
      if(o.air&&!src.hitAir) continue;
      if(dist(o.x,o.y,t.x,t.y)<=src.splash+o.radius) damageUnit(o,dmg);
    }
    if(t.isTower) damageTower(t,dmg);
  } else {
    if(t.isTower) damageTower(t,dmg); else damageUnit(t,dmg);
  }
  fx.push({type:'spark',x:t.x,y:t.y,t:0,dur:0.18,color:src.team===1?COL.pRing:COL.eRing});
}
function updateProjectiles(dt){
  for(const p of projectiles){
    if(p.target&&!p.target.dead&&p.target.alive!==false){ p.tx=p.target.x; p.ty=p.target.y; }
    const dx=p.tx-p.x, dy=p.ty-p.y, d=len2(dx,dy)||1, step=p.speed*dt;
    if(d<=step){ p.hit=true; impact(p); } else { p.x+=dx/d*step; p.y+=dy/d*step; }
  }
  projectiles=projectiles.filter(p=>!p.hit);
}
function impact(p){
  fx.push({type:'spark',x:p.tx,y:p.ty,t:0,dur:0.16,color:p.color});
  S.hit(p.splash?Math.max(p.dmg,140):p.dmg);
  if(p.splash){
    addShake(2);
    for(const u of units){ if(u.team===p.team||u.dead) continue;
      if(u.air&&!p.hitAir) continue;
      if(dist(u.x,u.y,p.tx,p.ty)<=p.splash+u.radius){ damageUnit(u,p.dmg); if(p.slow) u.slow=Math.max(u.slow,p.slow); } }
    for(const t of towers){ if(!t.alive||t.team===p.team) continue;
      if(dist(t.x,t.y,p.tx,p.ty)<=p.splash+t.radius) damageTower(t,p.dmg); }
    fx.push({type:'spell',x:p.tx,y:p.ty,r:p.splash,t:0,dur:0.3,color:p.color});
  } else if(p.target){
    const t=p.target; if(t.dead||t.alive===false) return;
    if(t.isTower) damageTower(t,p.dmg);
    else { damageUnit(t,p.dmg); if(p.slow) t.slow=Math.max(t.slow,p.slow); }
  }
}
function updateRollers(dt){
  for(const r of rollers){
    r.y+=r.dir*r.speed*dt;
    r.traveled+=r.speed*dt;
    r.spin+=dt*r.speed*1.6;
    for(const u of units){
      if(u.dead||u.team===r.team||u.air) continue;
      if(r.hit[u.id]) continue;
      if(Math.abs(u.x-r.x)<=r.width/2+u.radius && Math.abs(u.y-r.y)<=0.55+u.radius){
        r.hit[u.id]=1;
        damageUnit(u,r.dmg);
        if(!u.isBuilding){ u.kbY=r.dir*r.push; u.kbT=0.32; u.vx=0; u.vy=0; }
      }
    }
    if(r.traveled>=r.range||r.y<0.4||r.y>TY-0.4) r.done=true;
  }
  rollers=rollers.filter(r=>!r.done);
}
function updateTowers(dt){
  for(const t of towers){
    if(t.alive) t.dispHp+=(t.hp-t.dispHp)*Math.min(1,6*dt);
    if(!t.alive) continue;
    if(t.king&&!t.active) continue;
    t.cd-=dt;
    let best=null,bd=1e9;
    for(const u of units){ if(u.dead||u.team===t.team) continue;
      const d=dist(t.x,t.y,u.x,u.y); if(d<=t.range&&d<bd){bd=d;best=u;} }
    if(best&&t.cd<=0){ t.cd=t.atk;
      projectiles.push({x:t.x,y:t.y+(t.team===1?-0.2:0.2),tx:best.x,ty:best.y,target:best,team:t.team,
        dmg:t.dmg,splash:0,slow:0,hitAir:true,speed:11,color:t.team===1?COL.pRing:COL.eRing,r:0.18,kind:'bolt'}); }
  }
}

/* -------------------------------- FX ------------------------------- */
function puff(px,py,color,scale){ fx.push({type:'puff',px,py,t:0,dur:0.35,color:color||'#fff',scale:scale||1}); }
function updateFx(dt){
  for(const f of fx){ f.t+=dt; if(f.type==='debris'){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=10*dt; } }
  fx=fx.filter(f=>f.t<f.dur);
  for(const f of floaters) f.t+=dt;
  floaters=floaters.filter(f=>f.t<f.dur);
}
function updateElixir(side,dt){
  const base=(matchTime>=MATCH_LEN-DOUBLE_AT||overtime)?1/1.4:1/2.8;
  const mul=(!Net.on && side.team===-1)?AI_LEVELS[difficulty].elixirMul:1;
  side.elixir=Math.min(10,side.elixir+base*mul*dt);
}

/* -------------------------------- AI ------------------------------- */
function aiThink(dt){
  const s=enemy, cfg=AI_LEVELS[difficulty];
  s.aiTimer-=dt; if(s.aiTimer>0) return;

  let threat=null,tv=0;
  for(const u of units){ if(u.team!==1||u.dead) continue;
    if(u.y<RIVER+4 && u.hp>tv){ tv=u.hp; threat=u; } }
  let cx=9,cy=8,cnt=0;
  for(const u of units){ if(u.team!==1||u.dead||u.y>RIVER+5) continue;
    let c=0; for(const o of units){ if(o.team===1&&!o.dead&&dist(o.x,o.y,u.x,u.y)<2.0) c++; }
    if(c>cnt){ cnt=c; cx=u.x; cy=u.y; } }

  const aff=[]; s.hand.forEach((k,i)=>{ if(CARDS[k].cost<=s.elixir) aff.push({k,i}); });
  if(!aff.length){ s.aiTimer=0.4; return; }
  const has=k=>aff.find(a=>a.k===k);
  let pick=null, px=9, py=8;

  if(cnt>=cfg.spellMin && cy<RIVER+4){
    const sp=has('fireball')||has('frost')||has('jolt');
    if(sp){ pick=sp; px=cx; py=cy; }
  }
  if(!pick && cnt>=2 && cy<RIVER+3 && has('log')){ pick=has('log'); px=cx; py=cy-2.0; }
  if(!pick && threat && tv>900 && has('cannon')){
    pick=has('cannon'); px=clamp(threat.x<9?6.8:11.2,2,16); py=RIVER-3.5;
  }
  if(!pick && threat && tv>cfg.threatHp && srand()<cfg.defend){
    for(const k of ['bomber','whirl','slings','ratlings','recruit','wisps','brute','cannon']){
      const a=has(k); if(a){ pick=a; break; } }
    if(pick){ px=clamp(threat.x,2,16); py=clamp(RIVER-2.2,5,RIVER-1); }
  }
  if(!pick && s.elixir>=cfg.pushAt){
    const g=has('golem')||has('brute');
    if(g){ pick=g; px=srand()<0.5?BR_L:BR_R; py=3.5; }
  }
  if(!pick && s.elixir>=5){
    const tank=units.find(u=>u.team===-1&&!u.dead&&(u.card==='golem'||u.card==='brute'));
    for(const k of ['bomber','slings','wisps','whirl','ratlings','recruit']){
      const a=has(k); if(a){ pick=a; break; } }
    if(pick){
      if(tank){ px=clamp(tank.x,2,16); py=clamp(tank.y-1.2,3,RIVER-1); }
      else { px=srand()<0.5?BR_L:BR_R; py=6.2; }
    }
  }

  if(pick){
    if(cfg.mistake>0&&srand()<cfg.mistake) px=clamp(px+(srand()*4-2),1,TX-1);
    const c=CARDS[pick.k];
    if(c.type!=='spell'){
      let maxY=RIVER-0.6;
      if(px<9&&!towers.find(t=>t.key==='pL').alive) maxY=RIVER+7;
      if(px>=9&&!towers.find(t=>t.key==='pR').alive) maxY=RIVER+7;
      py=clamp(py,0.6,maxY); px=clamp(px,1,TX-1);
    }
    issueDeploy(-1,pick.i,px,py);
    s.aiTimer=cfg.delayMin+srand()*cfg.delayRand;
  } else s.aiTimer=0.5;
}

/* ------------------------------- WIN ------------------------------- */
function crownCount(team){ let c=0; for(const t of towers){ if(t.team===-team&&!t.alive) c+=t.king?3:1; } return c; }
function checkEnd(){
  const pKing=towers.find(t=>t.key==='pKing'), eKing=towers.find(t=>t.key==='eKing');
  if(!eKing.alive){ endMatch('victory'); return; }
  if(!pKing.alive){ endMatch('defeat'); return; }
  if(matchTime>=MATCH_LEN&&!overtime){
    const pc=crownCount(1), ec=crownCount(-1);
    if(pc!==ec){ endMatch(pc>ec?'victory':'defeat'); return; }
    overtime=true; matchTime=MATCH_LEN; fx.push({type:'banner',t:0,dur:2,text:'OVERTIME!'});
  }
  if(overtime){
    const pc=crownCount(1), ec=crownCount(-1);
    if(matchTime>=MATCH_LEN+OVERTIME){
      if(pc!==ec){ endMatch(pc>ec?'victory':'defeat'); return; }
      const pf=pKing.hp/pKing.maxHp, ef=eKing.hp/eKing.maxHp;
      endMatch(pf>ef?'victory':(ef>pf?'defeat':'draw')); return;
    }
    if(pc!==ec) endMatch(pc>ec?'victory':'defeat');
  }
}
function endMatch(r){            // r is canonical (host perspective)
  if(state==='over') return;
  if(Net.on && Net.myTeam===-1){ if(r==='victory') r='defeat'; else if(r==='defeat') r='victory'; }
  result=r; recordResult(r); state='over'; refreshAudio();
  if(Net.on){ netCleanup(); Net.on=false; INPUT_DELAY=0; }
  if(r==='victory') S.win(); else if(r==='defeat') S.lose();
}

/* ------------------------------ UPDATE ----------------------------- */
function update(dt){
  if(state!=='playing') return;
  tick++;
  applyDueCommands();
  matchTime+=dt;
  shake=Math.max(0,shake-34*dt);
  updateElixir(player,dt); updateElixir(enemy,dt);
  if(!Net.on) aiThink(dt);
  buildGrid();

  for(const u of units){
    if(u.dead) continue;
    u.dispHp+=(u.hp-u.dispHp)*Math.min(1,8*dt);
    if(u.hitFlash>0) u.hitFlash-=dt;
    if(u.lunge>0) u.lunge-=dt;
    if(u.slow>0) u.slow-=dt;
    if(u.deploy>0){ u.deploy-=dt; continue; }   // spawning: visible + targetable, but inert
    if(u.isBuilding){
      u.life-=dt;
      if(u.life<=0){ u.dead=true; puff(sx(u.x),sy(u.y),'#8a8a8a',0.8); continue; }
    }
    if(u.kbT>0){ applyKnockback(u,dt); continue; }
    if(u.stun>0){ u.stun-=dt; continue; }
    u.cd-=dt;
    u.retargetCd-=dt;
    if(u.retargetCd<=0||!u.target||u.target.dead||u.target.alive===false||!validTarget(u,u.target)){
      u.target=acquire(u); u.retargetCd=0.2;
    }
    if(u.target){
      const reach=u.range+u.radius+(u.target.radius||0.3);
      const d=dist(u.x,u.y,u.target.x,u.target.y);
      if(d>reach){ if(!u.isBuilding) steerUnit(u,dt); }
      else unitAttack(u);
    }
  }
  units=units.filter(u=>!u.dead);

  updateProjectiles(dt);
  updateRollers(dt);
  updateTowers(dt);
  updateFx(dt);
  netUpdate(dt);
  checkEnd();
}

/* ------------------------------ RENDER ----------------------------- */
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d1119'; ctx.fillRect(0,0,W,H);
  if(state==='menu'||state==='help'||state==='stats'||state==='deck'||
     state==='netmenu'||state==='netjoin'||state==='netroom'||state==='netsearch'||
     state==='chests'||state==='chestopen'||state==='collection'){ drawMenu(); return; }
  if(!player||!towers.length) return;

  const shx=shake?(Math.random()*2-1)*shake:0, shy=shake?(Math.random()*2-1)*shake:0;
  ctx.save(); ctx.translate(shx,shy);
  ctx.drawImage(bg,arenaX,arenaY,arenaW,arenaH);
  drawWater();
  if(sel>=0&&CARDS[mySide().hand[sel]].type!=='spell') drawDeployZone();
  for(const t of towers) drawTower(t);
  drawList.length=0;
  for(let i=0;i<units.length;i++) drawList.push(units[i]);
  drawList.sort(depthCmp);
  for(let i=0;i<drawList.length;i++) drawUnit(drawList[i]);
  for(const r of rollers) drawRoller(r);
  for(const p of projectiles) drawProjectile(p);
  for(const f of fx) if(f.type!=='banner') drawFx(f);
  for(const f of floaters) drawFloater(f);
  ctx.fillStyle=getVignette(); ctx.fillRect(0,arenaY,W,arenaH);
  ctx.restore();

  if(dragging&&sel>=0) drawGhost();
  for(const f of fx){ if(f.type==='banner'){
    const k=f.t/f.dur; ctx.globalAlpha=k<0.15?k/0.15:(k>0.7?(1-k)/0.3:1);
    ctx.fillStyle='#ffd23c'; ctx.font=`bold ${Math.round(H*0.07)}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.text,W/2,arenaY+arenaH*0.4); ctx.globalAlpha=1;
  }}
  drawTopBar(); drawHUD(); if(Net.on) drawNetBadge();
  if(state==='paused') drawPause();
  if(state==='netquit') drawNetQuit();
  if(state==='over') drawOver();
}
function drawWater(){
  const T=tile, y0=sy(RIVER-0.9), h=1.8*T, t=now*0.00035;
  ctx.save();
  ctx.globalAlpha=0.20; ctx.fillStyle=COL.waterHi;
  for(let i=0;i<7;i++){
    const ph=(t+i*0.143)%1;
    const x=arenaX+ph*arenaW - arenaW*0.12;
    const yy=y0+h*(0.16+0.11*i);
    ctx.fillRect(x, yy, T*1.5, T*0.09);
    ctx.fillRect(x-T*2.4, yy+T*0.22, T*0.9, T*0.07);
  }
  ctx.globalAlpha=0.13; ctx.fillStyle='#ffffff';
  ctx.fillRect(arenaX, y0+h*0.06, arenaW, T*0.06);
  ctx.restore();
}
function drawUnit(u){
  const T=tile, X=sx(u.x), Y=sy(u.y), R=u.radius*T, face=u.team===1?-1:1;
  const gs=GROUND_SPR[u.draw+'_'+u.team];
  if(gs) ctx.drawImage(gs.canvas,X-gs.cw/2,Y-gs.ch/2,gs.cw,gs.ch);
  const bob=u.isBuilding?0:Math.sin(u.walk)*T*0.06;
  const lung=(u.lunge>0?u.lunge/0.12:0)*T*0.18;
  const airf=u.air?Math.sin(now*0.004+u.id)*T*0.15:0;
  const cy=Y-R*0.5+bob+airf+lung*face;
  const st=u.hitFlash>0?1:0, bs=UNIT_SPR[u.draw+'_'+u.team+'_'+st];
  if(bs) ctx.drawImage(bs.canvas,X-bs.cw/2,cy-bs.ch/2,bs.cw,bs.ch);

  if(u.slow>0){
    ctx.save(); ctx.globalAlpha=0.32; ctx.fillStyle=COL.frost;
    ctx.beginPath(); ctx.arc(X,cy,R*1.02,0,7); ctx.fill();
    ctx.globalAlpha=0.75; ctx.strokeStyle='#ffffff'; ctx.lineWidth=Math.max(1,T*0.05);
    ctx.beginPath(); ctx.arc(X,Y+R*0.5,R*0.85,0,7); ctx.stroke();
    ctx.restore();
  }
  if(u.stun>0){
    ctx.save(); ctx.strokeStyle='#ffe14d'; ctx.lineWidth=Math.max(1.5,T*0.06); ctx.globalAlpha=0.9;
    for(let i=0;i<3;i++){ const a=now*0.008+i*2.1;
      ctx.beginPath(); ctx.arc(X+Math.cos(a)*R*0.9,cy-R*1.25,R*0.13,0,7); ctx.stroke(); }
    ctx.restore();
  }
  if(u.deploy>0){
    const k=clamp(1-u.deploy/(u.maxDeploy||1),0,1), cr=R*0.8;
    ctx.save();
    ctx.globalAlpha=0.55*(1-k)+0.15;
    ctx.strokeStyle=u.team===1?COL.pRing:COL.eRing;
    ctx.lineWidth=Math.max(1.5,T*0.07);
    const gs2=0.45+k*0.75;
    ctx.beginPath(); ctx.ellipse(X,Y+R*0.55,R*0.95*gs2,R*0.42*gs2,0,0,7); ctx.stroke();
    ctx.globalAlpha=0.9;
    ctx.fillStyle='rgba(8,12,20,0.66)';

function drawDeployZone(){

function isValidDeploy(x,y,c){
  if(x<0.6||x>TX-0.6||y<0.6||y>TY-0.6) return false;
  if(c.type==='spell') return true;
  const me=MYTEAM();
  if(me===1){
    if(y>RIVER+0.5) return true;
    const l=!towers.find(t=>t.key==='eL').alive, r=!towers.find(t=>t.key==='eR').alive;
    if(l&&x<9&&y>6) return true;
    if(r&&x>=9&&y>6) return true;
  } else {
    if(y<RIVER-0.5) return true;
    const l=!towers.find(t=>t.key==='pL').alive, r=!towers.find(t=>t.key==='pR').alive;
    if(l&&x<9&&y<TY-6) return true;
    if(r&&x>=9&&y<TY-6) return true;
  }
  return false;
}
function drawGhost(){
  const a=toArena(drag.x,drag.y-tile*1.6*(FLIP()?-1:1)), gx=a.x, gy=a.y;

    for(let i=1;i<=3;i++){

      ctx.beginPath(); ctx.moveTo(X-T*0.28,ay+T*0.22); ctx.lineTo(X,ay-T*0.16); ctx.lineTo(X+T*0.28,ay+T*0.22); ctx.closePath(); ctx.fill();

    const rad=c.radius*T, pulse=0.5+0.5*Math.sin(now*0.006);

    g.addColorStop(0,c.draw==='jolt'?'rgba(255,225,77,0.30)':(c.draw==='frost'?'rgba(143,228,255,0.32)':'rgba(255,140,50,0.32)'));
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(X,Y,rad,0,7); ctx.fill();
    ctx.globalAlpha=0.95; ctx.strokeStyle=valid?c.color:'#ff7a7a'; ctx.lineWidth=2+pulse*2;
    ctx.beginPath(); ctx.arc(X,Y,rad,0,7); ctx.stroke();
    ctx.save(); ctx.setLineDash([T*0.4,T*0.35]); ctx.lineDashOffset=-now*0.02; ctx.lineWidth=2;
    ctx.globalAlpha=0.6; ctx.strokeStyle=c.color; ctx.beginPath(); ctx.arc(X,Y,rad*0.82,0,7); ctx.stroke(); ctx.restore();
    ctx.globalAlpha=0.85; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(X-9,Y); ctx.lineTo(X+9,Y); ctx.moveTo(X,Y-9); ctx.lineTo(X,Y+9); ctx.stroke();
    ctx.globalAlpha=1;
  } else {
    ctx.globalAlpha=0.85; ctx.strokeStyle=valid?'#7fffa0':'#ff7a7a'; ctx.lineWidth=3;

function cardRects(){

function drawHUD(){
  const hy=H-HUD_H;
  ctx.fillStyle=COL.panel; ctx.fillRect(0,hy,W,HUD_H);
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(0,hy,W,2);
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font=`600 ${Math.round(HUD_H*0.09)}px system-ui`; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('Next: '+CARDS[mySide().pending[0]].name,W*0.02,hy+HUD_H*0.20);
  const ex=W*0.02, ew=W*0.96, ey=hy+HUD_H*0.20, eh=HUD_H*0.09, seg=ew/10;
  ctx.fillStyle='#2a1030'; rr(ctx,ex,ey,ew,eh,eh/2); ctx.fill();
  const _me=mySide(); const full=Math.floor(_me.elixir), frac=_me.elixir-full;
  ctx.save(); rr(ctx,ex,ey,ew,eh,eh/2); ctx.clip();

  ctx.fillStyle=shade(COL.elixir,0.8); ctx.fillRect(ex+seg*full,ey,seg*frac,eh); ctx.restore();

  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(eh*1.1)}px system-ui`; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(Math.floor(_me.elixir),ex+6,ey+eh/2);

    const c=CARDS[_me.hand[i]], afford=_me.elixir>=c.cost, selected=(sel===i);

function wrapText(t,cx,cy,maxw,lh){
  const words=t.split(' '); let line='',lines=[];
  for(const w of words){ const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxw&&line){ lines.push(line); line=w; } else line=test; }
  if(line) lines.push(line);
  const startY=cy-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,cx,startY+i*lh));
}

function deckRects(){
  const n=POOL.length, cols=4, rows=Math.ceil(n/cols);
  const areaTop=H*0.16, areaBot=H*0.80, pad=W*0.022;
  let cw=(W-pad*(cols+1))/cols, ch=cw*1.28;
  const maxCh=(areaBot-areaTop-pad*(rows-1))/rows;
  if(ch>maxCh){ ch=maxCh; cw=ch/1.28; }
  const gridW=cols*cw+pad*(cols-1), x0=(W-gridW)/2;
  const rects=[];
  for(let i=0;i<n;i++){
    const r=Math.floor(i/cols), c=i%cols;
    rects.push({x:x0+c*(cw+pad), y:areaTop+r*(ch+pad), w:cw, h:ch, key:POOL[i]});
  }
  return rects;
}

   Deterministic lockstep over Realtime Database. Only card plays cross
   the wire; both clients run the identical simulation from a shared seed.
   Host is team 1, guest is team -1; the guest's view is mirrored.
   ==================================================================== */
const FB_CONFIG = {
  apiKey: "AIzaSyBfQGKZ7GOOk8UpGMLXrAS-AS-VaOr11rM",
  authDomain: "bridge-brawl-54f96.firebaseapp.com",

  messagingSenderId: "828078912626",
  appId: "1:828078912626:web:d373cff80658299e00feeb"
};
const NET_DELAY_TICKS = 18;        // ~300ms cover for a ~200ms relay
const SYNC_EVERY      = 120;       // checksum exchange cadence (ticks)
const GRACE_MS        = 6000;      // opponent disconnect grace period

const Net = {
  ready:false, err:'', uid:null, db:null,
  on:false, role:null, myTeam:1, code:null,
  roomRef:null, refs:[], status:'', foeDeck:null, foeLv:null, foeSeen:0,
  desync:false, foeLeft:false, foeForfeit:false, lastSyncTick:0, sums:{}, seed:0,
  searching:false, queueRef:null,
};
function netAvailable(){ return typeof firebase!=='undefined' && firebase && firebase.initializeApp; }
function netInit(cb){
  if(Net.ready){ cb&&cb(null); return; }
  if(!netAvailable()){ Net.err='Firebase SDK failed to load. Check your connection.'; cb&&cb(Net.err); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    Net.db=firebase.database();
    firebase.auth().signInAnonymously().catch(e=>{
      Net.err = (e && e.code==='auth/unauthorized-domain')
        ? 'This domain is not authorised in Firebase Auth. Add it under Authentication → Settings → Authorized domains.'
        : ('Sign-in failed: '+((e&&e.code)||e));
      cb&&cb(Net.err);
    });
    firebase.auth().onAuthStateChanged(u=>{
      if(u){ Net.uid=u.uid; Net.ready=true; Net.err=''; cb&&cb(null); }
    });
  }catch(e){ Net.err='Firebase init failed: '+e.message; cb&&cb(Net.err); }
}
function netCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ';   // no I/O to avoid confusion with 1/0
  let s=''; for(let i=0;i<4;i++) s+=A[(Math.random()*A.length)|0];
  return s;
}
function netTrack(ref,ev,fn){ ref.on(ev,fn); Net.refs.push({ref,ev,fn}); }
function netCleanup(){
  for(const r of Net.refs){ try{ r.ref.off(r.ev,r.fn); }catch(e){} }
  Net.refs=[];
  if(Net.queueRef){ try{ Net.queueRef.remove(); }catch(e){} Net.queueRef=null; }
}
function netAnnounceQuit(){
  if(Net.roomRef&&Net.uid){ try{ Net.roomRef.child('players/'+Net.uid).update({gone:true,forfeit:true}); }catch(e){} }
}
function netLeave(quiet){
  netCleanup();
  if(Net.roomRef && Net.uid && !quiet){
    try{ Net.roomRef.child('players/'+Net.uid+'/gone').set(true); }catch(e){}
  }
  Net.on=false; Net.role=null; Net.code=null; Net.roomRef=null; Net.foeForfeit=false;
  Net.myTeam=1; Net.desync=false; Net.foeLeft=false; Net.foeDeck=null;
  Net.searching=false; Net.sums={}; Net.status='';
}

/* ---- room lifecycle ---- */
function netHost(){
  Net.status='Creating room…';
  netInit(err=>{
    if(err){ Net.status=err; return; }
    const code=netCode();
    Net.code=code; Net.role='host'; Net.myTeam=1;
    Net.seed=(Math.random()*0xFFFFFFFF)>>>0;
    Net.roomRef=Net.db.ref('rooms/'+code);
    Net.roomRef.set({
      host:Net.uid, seed:Net.seed, createdAt:Date.now(), state:'waiting',
      players:{ [Net.uid]:{ role:'host', deck:stats.deck, lv:myLevels(), ts:Date.now() } }
    }).then(()=>{
      Net.roomRef.child('players/'+Net.uid).onDisconnect().update({gone:true});
      Net.status='Waiting for opponent…';
      state='netroom';
      netWatchRoom();
    }).catch(e=>{ Net.status='Could not create room: '+(e.code||e.message); });
  });
}
function netJoin(code){
  Net.status='Joining '+code+'…';
  Net.searching=false;
  netCleanup();
  netInit(err=>{
    if(err){ Net.status=err; return; }
    const ref=Net.db.ref('rooms/'+code);
    ref.get().then(snap=>{
      const v=snap.val();
      if(!v){ Net.status='No room with code '+code; return; }
      if(v.guest && v.guest!==Net.uid){ Net.status='That room is full'; return; }
      Net.code=code; Net.role='guest'; Net.myTeam=-1;
      Net.seed=v.seed>>>0; Net.roomRef=ref;
      const hostEntry=v.players&&v.players[v.host];
      Net.foeDeck=(hostEntry&&hostEntry.deck)||DEFAULT_DECK.slice();
      Net.foeLv=(hostEntry&&hostEntry.lv)||{};
      return ref.update({
        guest:Net.uid,
        ['players/'+Net.uid]:{ role:'guest', deck:stats.deck, lv:myLevels(), ts:Date.now() }
      }).then(()=>{
        ref.child('players/'+Net.uid).onDisconnect().update({gone:true});
        Net.status='Connected — starting…';
        state='netroom';
        netWatchRoom();
      });
    }).catch(e=>{ Net.status='Join failed: '+(e.code||e.message); });
  });
}
function netWatchRoom(){
  const ref=Net.roomRef;
  netTrack(ref.child('players'),'value',snap=>{
    const p=snap.val()||{};
    const others=Object.keys(p).filter(k=>k!==Net.uid);
    if(!others.length) return;
    const foe=p[others[0]];
    if(foe.gone){
      if(Net.on){ Net.foeLeft=true; if(foe.forfeit) Net.foeForfeit=true; }
      else Net.status='Opponent left';
      return;
    }
    if(foe.deck) Net.foeDeck=foe.deck;
    if(foe.lv) Net.foeLv=foe.lv;
    if(!Net.on && Net.foeDeck) netBegin();
  });
  netTrack(ref.child('cmds'),'child_added',snap=>{
    if(snap.key===Net.uid) return;
    netTrack(ref.child('cmds/'+snap.key),'child_added',cs=>{
      const c=cs.val(); if(!c) return;
      queueCommand({tick:c.t, type:'deploy', team:-Net.myTeam, slot:c.s, x:c.x, y:c.y});
    });
  });
  netTrack(ref.child('sync'),'value',snap=>{
    const s=snap.val()||{};
    for(const k in s){ if(k!==Net.uid) Net.sums[s[k].tick]=s[k].sum; }
  });
}
function netBegin(){
  if(Net.queueRef){ try{Net.queueRef.remove();}catch(e){} Net.queueRef=null; }
  Net.on=true; Net.desync=false; Net.foeLeft=false; Net.sums={};
  INPUT_DELAY=NET_DELAY_TICKS;
  Net.status='';
  const myDeck=stats.deck.slice(), foe=(Net.foeDeck||DEFAULT_DECK).slice();
  const myLv=myLevels(), foeLv=Net.foeLv||{};
  const host=Net.role==='host';
  startMatch(Net.seed, host?myDeck:foe, host?foe:myDeck, host?myLv:foeLv, host?foeLv:myLv);
}
/* ---- quick match queue ---- */
function netQuick(){
  Net.status='Searching…';
  netInit(err=>{
    if(err){ Net.status=err; return; }
    Net.searching=true; state='netsearch';
    const qref=Net.db.ref('queue/'+Net.uid);
    Net.queueRef=qref;
    qref.set({t:Date.now(), deck:stats.deck});
    qref.onDisconnect().remove();
    netTrack(Net.db.ref('queue'),'value',snap=>{
      if(!Net.searching||Net.on) return;
      const q=snap.val()||{}, nowMs=Date.now();
      const fresh=k=>q[k]&&q[k].t&&(nowMs-q[k].t)<60000;      // ignore abandoned tickets
      // (a) has someone already paired with me? their own node carries the code
      for(const k in q){
        if(k!==Net.uid && fresh(k) && q[k].pair===Net.uid && q[k].room){
          Net.searching=false;
          const code=q[k].room;
          if(Net.queueRef){ Net.queueRef.remove(); Net.queueRef=null; }
          netJoin(code);
          return;
        }
      }
      // (b) otherwise, should I be the host?
      const others=Object.keys(q).filter(k=>k!==Net.uid&&fresh(k)&&!q[k].room&&!q[k].pair);
      if(!others.length) return;
      others.sort();
      const foeUid=others[0];
      if(Net.uid<foeUid){                                // lower uid hosts — no race
        Net.searching=false;
        const code=netCode();
        Net.code=code; Net.role='host'; Net.myTeam=1;
        Net.seed=(Math.random()*0xFFFFFFFF)>>>0;
        Net.roomRef=Net.db.ref('rooms/'+code);
        Net.roomRef.set({
          host:Net.uid, seed:Net.seed, createdAt:Date.now(), state:'waiting',
          players:{ [Net.uid]:{ role:'host', deck:stats.deck, lv:myLevels(), ts:Date.now() } }
        }).then(()=>{
          Net.roomRef.child('players/'+Net.uid).onDisconnect().update({gone:true});
          // advertise on MY OWN ticket — writing the opponent's node is denied by rules
          return qref.update({room:code, pair:foeUid, t:Date.now()});
        }).then(()=>{
          Net.status='Opponent found…'; state='netroom'; netWatchRoom();
        }).catch(e=>{
          Net.status='Match failed: '+(e.code||e.message);
          Net.searching=true; Net.roomRef=null;
        });
      }
    });
  });
}
/* ---- in-match traffic ---- */
function netSendDeploy(c){
  if(!Net.on||!Net.roomRef) return;
  try{ Net.roomRef.child('cmds/'+Net.uid).push({t:c.tick, s:c.slot, x:c.x, y:c.y}); }catch(e){}
}
function netTickSync(){
  if(!Net.on||!Net.roomRef) return;
  if(tick-Net.lastSyncTick < SYNC_EVERY) return;
  Net.lastSyncTick=tick;
  const sum=stateChecksum();
  try{ Net.roomRef.child('sync/'+Net.uid).set({tick, sum}); }catch(e){}
  for(const t in Net.sums){
    if(Math.abs(t-tick)<1 && Net.sums[t]!==sum){ Net.desync=true; }
  }
}
function netUpdate(dt){
  if(!Net.on) return;
  netTickSync();
  if(Net.foeLeft && state==='playing'){
    Net.foeGrace=(Net.foeGrace||0)+dt*1000;
    if(Net.foeForfeit || Net.foeGrace>GRACE_MS){
      Net.foeGrace=0; endMatch(Net.myTeam===1?'victory':'defeat');
    }
  } else Net.foeGrace=0;
  if(Net.desync && state==='playing'){ result='desync'; recordDesync(); state='over'; netCleanup(); Net.on=false; INPUT_DELAY=0; refreshAudio(); }
}

/* view helpers — guest sees the board mirrored, sim stays canonical */
function FLIP(){ return Net.on && Net.myTeam===-1; }
function MYTEAM(){ return Net.on ? Net.myTeam : 1; }
function mySide(){ return MYTEAM()===1 ? player : enemy; }
function foeSide(){ return MYTEAM()===1 ? enemy : player; }

function drawChestIcon(cx,cy,r,tier,openAmt){
  const c=CHESTS[tier], dk=shade(c.color,0.6), lt=shade(c.color,1.25);
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(0,r*0.92,r*0.95,r*0.22,0,0,7); ctx.fill();
  ctx.fillStyle=dk; rr(ctx,-r*0.8,-r*0.1,r*1.6,r*0.95,r*0.12); ctx.fill();
  ctx.fillStyle=c.color; rr(ctx,-r*0.7,0,r*1.4,r*0.78,r*0.1); ctx.fill();
  const lid=-(openAmt||0)*r*0.9;
  ctx.save(); ctx.translate(0,lid);
  ctx.fillStyle=dk;
  ctx.beginPath(); ctx.moveTo(-r*0.82,-r*0.08);
  ctx.quadraticCurveTo(0,-r*0.95,r*0.82,-r*0.08); ctx.closePath(); ctx.fill();
  ctx.fillStyle=lt;
  ctx.beginPath(); ctx.moveTo(-r*0.68,-r*0.12);
  ctx.quadraticCurveTo(0,-r*0.8,r*0.68,-r*0.12); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#f2c33c'; rr(ctx,-r*0.16,-r*0.16,r*0.32,r*0.5,r*0.06); ctx.fill();
  ctx.fillStyle='#8a6a12'; ctx.beginPath(); ctx.arc(0,r*0.06,r*0.09,0,7); ctx.fill();
  ctx.restore();
}

function chestSlotRects(){
  const n=MAX_CHESTS, cols=3, out=[];
  const cw=W*0.26, ch=cw*0.86, pad=W*0.03;
  const gw=cols*cw+pad*(cols-1), x0=(W-gw)/2, y0=H*0.24;
  for(let i=0;i<n;i++){
    const r=Math.floor(i/cols), c=i%cols;
    out.push({x:x0+c*(cw+pad), y:y0+r*(ch+pad), w:cw, h:ch, i});
  }
  return out;
}

function collectionMaxScroll(){

    out.push({x:pad+c*(cw+pad), y:top+r*(ch+pad*1.6)-colScroll, w:cw, h:ch, key:k});

function keyRects(){
  const rows=['ABCDEFG','HJKLMNP','QRSTUVW','XYZ'];
  const out=[], top=H*0.44, kh=Math.min(H*0.068,W*0.12), pad=W*0.012;
  rows.forEach((row,r)=>{
    const kw=Math.min((W-pad*(row.length+1))/row.length,W*0.12);

    for(let i=0;i<row.length;i++)

  });
  return out;
}

/* ------------------------------ INPUT ------------------------------ */
function evPos(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
function inRect(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
function tryDeploy(px,py){
  const me=mySide();
  if(sel<0) return; const c=CARDS[me.hand[sel]];
  if(me.elixir<c.cost){ sel=-1; return; }
  const a=toArena(px,py-tile*1.6*(FLIP()?-1:1));
  if(!isValidDeploy(a.x,a.y,c)) return;
  const cmd=issueDeploy(MYTEAM(),sel,a.x,a.y);
  netSendDeploy(cmd);
  sel=-1;
}
function onDown(e){
  e.preventDefault(); resumeAC(); const p=evPos(e);
  if(state==='deck'){
    for(const b of buttons){ if(inRect(p,b)){ b.onClick(); return; } }
    for(const r of deckRects()){ if(inRect(p,r)){ toggleDeckCard(r.key); return; } }
    return;
  }
  if(state==='chests'){
    for(const b of buttons){ if(inRect(p,b)){ b.onClick(); return; } }
    for(const r of chestSlotRects()){
      if(inRect(p,r)&&stats.chests[r.i]){
        const tier=stats.chests.splice(r.i,1)[0];
        chestOpen=openChest(tier); chestT=0; state='chestopen';
        beep(520,0.12,'triangle',0.07); setTimeout(()=>beep(780,0.18,'triangle',0.06),140);
        return;
      }
    }
    return;
  }
  if(state==='chestopen'){
    for(const b of buttons){ if(inRect(p,b)){ b.onClick(); return; } }
    return;
  }
  if(state==='collection'){
    for(const b of buttons){ if(inRect(p,b)){ b.onClick(); return; } }
    dragging=true; drag=p; return;
  }
  if(state==='netjoin'){
    for(const b of buttons){ if(inRect(p,b)){ b.onClick(); return; } }
    if(joinBuf.length<4) for(const k of keyRects()){
      if(inRect(p,k)){ joinBuf+=k.ch; Net.status=''; return; } }
    return;
  }
  if(state==='netquit'){
    for(const b of buttons){ if(inRect(p,b)){ b.onClick(); return; } }
    return;
  }
  if(state!=='playing'){
    for(const b of buttons){ if(inRect(p,b)){ b.onClick(); return; } }
    return;
  }
  if(inRect(p,pauseRect())){ if(Net.on){ state='netquit'; return; } state='paused'; sel=-1; dragging=false; refreshAudio(); return; }
  const rects=cardRects();
  for(let i=0;i<rects.length;i++){ if(inRect(p,rects[i])){
    if(mySide().elixir>=CARDS[mySide().hand[i]].cost){ sel=i; dragging=true; drag=p; }
    return; } }
  if(sel>=0&&p.y<H-HUD_H){ dragging=true; drag=p; }
}
function onMove(e){
  if(state==='collection'&&dragging){ e.preventDefault();
    const p=evPos(e); colScroll=clamp(colScroll+(drag.y-p.y),0,collectionMaxScroll()); drag=p; return; }
  if(!dragging) return; e.preventDefault(); drag=evPos(e);
}
function onUp(e){
  if(state==='collection'){ dragging=false; return; }
  if(state!=='playing'||!dragging) return;
  const p=drag; dragging=false;
  if(p.y<H-HUD_H&&sel>=0) tryDeploy(p.x,p.y);
}
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove',onMove,{passive:false});
cv.addEventListener('touchend',onUp,{passive:false});
cv.addEventListener('mousedown',onDown);
cv.addEventListener('mousemove',onMove);
cv.addEventListener('mouseup',onUp);

/* ------------------------------- LOOP ------------------------------ */
function loop(ts){
  now=ts;
  let frame=(ts-last)/1000; last=ts;
  if(frame>0.25) frame=0.25; if(frame<0) frame=0;
  if(state==='chestopen') chestT+=frame;
  acc+=frame;
  let guard=0;
  while(acc>=STEP&&guard<5){ update(STEP); acc-=STEP; guard++; }
  if(acc>STEP*5) acc=0;
  render();
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));

function goBackground(){
  Music.stop();
  try{ if(AC&&AC.state==='running') AC.suspend(); }catch(e){}
  if(state==='playing') state='paused';
}
function goForeground(){
  const a=actx(); if(a&&a.state==='suspended'){ try{ a.resume(); }catch(e){} }
  refreshAudio();
}
document.addEventListener('visibilitychange',()=>{ document.hidden?goBackground():goForeground(); });
window.addEventListener('pagehide',goBackground);
window.addEventListener('blur',()=>{ if(document.hidden) goBackground(); });

loadStats();
resize();
last=performance.now();
requestAnimationFrame(loop);

})();
</script>
