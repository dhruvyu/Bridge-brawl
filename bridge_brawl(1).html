<!doctype html>
<html lang="en">

<title>Bridge Brawl</title>
<style>

<body>
<div id="stage"><canvas id="c"></canvas></div>
<button id="mute" aria-label="Toggle sound">🔊</button>
<script>
(function(){
"use strict";

/* =========================================================================
   BRIDGE BRAWL — single-file lane-battle game
   CONFIG · DATA · STATE · AUDIO · STORAGE · HELPERS · LAYOUT · BG · SPRITES
   DECK · MATCH · SPAWN · COMBAT · STEERING · FX · AI · WIN · UPDATE
   RENDER · HUD · MENUS · DECKBUILDER · INPUT · LOOP
   ========================================================================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ------------------------------ CONFIG ------------------------------ */
const TX = 18, TY = 28;
const RIVER = 14;
const BR_L = 4, BR_R = 14;
const BRIDGE_HALF = 0.62;             // half-width of walkable bridge deck
const MATCH_LEN = 150, DOUBLE_AT = 40, OVERTIME = 60;
const STEP = 1/60;
/* Deploy delay scales with card weight: cheap cycle cards land fast,
   heavy tanks telegraph. Per-card `deploy` overrides this fallback. */
function deployTime(c){ return c.deploy!=null ? c.deploy : 0.35+(c.cost||3)*0.16; }

const TOWERS_DEF = {
  eKing:{x:9,   y:2.4, king:true,  team:-1},
  eL:   {x:BR_L,y:5.2, king:false, team:-1},
  eR:   {x:BR_R,y:5.2, king:false, team:-1},
  pKing:{x:9,   y:25.6,king:true,  team:1},
  pL:   {x:BR_L,y:22.8,king:false, team:1},
  pR:   {x:BR_R,y:22.8,king:false, team:1},
};

/* ------------------------------- DATA ------------------------------- */
/* targets: 'any' | 'buildings' (towers+buildings only) | 'units' (buildings never hit towers) */
const CARDS = {
  recruit:  {name:'Recruit', cost:2, deploy:0.60, type:'troop', count:1, hp:640, dmg:78, atk:1.1, range:0.8, speed:1.35, targets:'any', hitAir:false, radius:0.42, draw:'recruit', color:'#c9d3e0'},
  ratlings: {name:'Ratlings', cost:3, deploy:0.60, type:'troop', count:4, hp:72, dmg:46, atk:0.7, range:0.7, speed:2.05, targets:'any', hitAir:false, radius:0.30, draw:'rat', color:'#b7986a'},
  slings:   {name:'Sling Twins', cost:3, deploy:0.75, type:'troop', count:2, hp:130, dmg:44, atk:0.9, range:5.0, speed:1.35, targets:'any', hitAir:true, ranged:true, radius:0.32, draw:'sling', color:'#e6c07a'},
  whirl:    {name:'Whirlblade', cost:4, deploy:0.90, type:'troop', count:1, hp:880, dmg:130, atk:1.4, range:0.9, speed:1.25, targets:'any', hitAir:false, splash:1.25, radius:0.48, draw:'whirl', color:'#c98fb0'},
  wisps:    {name:'Wisp Flock', cost:4, deploy:0.80, type:'troop', count:3, hp:104, dmg:46, atk:1.0, range:2.0, speed:1.7, targets:'any', air:true, hitAir:true, ranged:true, radius:0.30, draw:'wisp', color:'#9be0ff'},
  bomber:   {name:'Bombardier', cost:4, deploy:0.90, type:'troop', count:1, hp:290, dmg:150, atk:1.7, range:4.2, speed:1.3, targets:'any', hitAir:false, ranged:true, splash:1.35, radius:0.42, draw:'bomber', color:'#d59a5a'},
  brute:    {name:'Iron Brute', cost:5, deploy:1.15, type:'troop', count:1, hp:1500, dmg:200, atk:1.5, range:0.85, speed:0.95, targets:'any', hitAir:false, radius:0.56, draw:'brute', color:'#b05c4a'},
  golem:    {name:'Boulder Golem', cost:7, deploy:1.60, type:'troop', count:1, hp:3200, dmg:220, atk:1.6, range:0.95, speed:0.72, targets:'buildings', hitAir:false, radius:0.72, draw:'golem', color:'#8b8f96'},

  cannon:   {name:'Cannon', cost:3, deploy:0.95, type:'building', count:1, hp:400, dmg:92, atk:0.9, range:5.5, speed:0, targets:'units', hitAir:false, ranged:true, life:30, radius:0.52, draw:'cannon', color:'#6b7078'},
  frostspire:{name:'Frostspire', cost:4, deploy:1.05, type:'building', count:1, hp:440, dmg:40, atk:1.2, range:5.0, speed:0, targets:'units', hitAir:true, ranged:true, slow:1.8, life:30, radius:0.52, draw:'spire', color:'#7fd4ff'},

  jolt:     {name:'Jolt', cost:2, type:'spell', mode:'area', dmg:104, radius:2.4, stun:0.8, draw:'jolt', color:'#ffe14d'},
  log:      {name:'Rolling Log', cost:2, type:'spell', mode:'roll', dmg:124, push:3.2, width:1.8, range:8.0, rollSpeed:6.5, draw:'log', color:'#9a7549'},
  frost:    {name:'Frost Blast', cost:3, type:'spell', mode:'area', dmg:88, radius:2.3, slow:4.0, draw:'frost', color:'#8fe4ff'},
  fireball: {name:'Fireball', cost:4, type:'spell', mode:'area', dmg:360, radius:2.4, draw:'fireball', color:'#ff7a3c'},
};
const POOL = ['recruit','ratlings','slings','whirl','wisps','bomber','brute','golem','cannon','frostspire','jolt','log','frost','fireball'];
const DEFAULT_DECK = ['recruit','ratlings','slings','wisps','bomber','golem','fireball','jolt'];
const UNIT_TYPES = POOL.filter(k=>CARDS[k].type!=='spell');

const AI_LEVELS = {
  easy:  {label:'Easy',   delayMin:1.5, delayRand:2.0, elixirMul:0.85, spellMin:4, threatHp:420, defend:0.55, pushAt:9.5, mistake:0.40},
  medium:{label:'Medium', delayMin:0.7, delayRand:1.4, elixirMul:1.00, spellMin:3, threatHp:220, defend:0.90, pushAt:8.0, mistake:0.14},
  hard:  {label:'Hard',   delayMin:0.35,delayRand:0.75,elixirMul:1.15, spellMin:2, threatHp:120, defend:1.00, pushAt:7.0, mistake:0.00},
};
const AI_DECKS = {
  easy:  ['recruit','ratlings','slings','wisps','bomber','cannon','jolt','log'],
  medium:['recruit','ratlings','slings','bomber','golem','cannon','fireball','jolt'],
  hard:  ['ratlings','slings','bomber','whirl','brute','golem','cannon','fireball'],
};

const TOWER_STATS = {
  princess:{hp:1512, dmg:74, atk:0.8, range:7.5},
  king:    {hp:2568, dmg:92, atk:1.0, range:7.0},
};
const COL = {
  grassA:'#5ba043', grassB:'#69ad4c', grassEdge:'#4c8c39',
  water:'#2f7fb5', waterHi:'#4fa0d6', wood:'#9a7549', woodDk:'#7a5b36',
  pRing:'#39b0ff', eRing:'#ff5a4d', pTower:'#3a86c4', eTower:'#c8483f',
  elixir:'#d63bd6', panel:'#141a24', frost:'#8fe4ff',
};

/* ------------------------------ STATE ------------------------------ */
let W=0,H=0,DPR=1;
let tile=20, arenaX=0, arenaY=0, arenaW=0, arenaH=0, TOP_H=46, HUD_H=150;
let bg=null;
let UNIT_SPR={}, GROUND_SPR={};

let state='menu', result='', now=0, last=0, acc=0;
let matchTime=0, overtime=false;
let units=[], projectiles=[], rollers=[], fx=[], floaters=[], towers=[];
let player, enemy, uid=1, shake=0;
let difficulty='medium';
let deckMsg='';

let sel=-1, dragging=false, drag={x:0,y:0};
let buttons=[];

/* ------------------------------ AUDIO ------------------------------ */
let AC=null, muted=false, musicOn=true, sfxOn=true, _lastHit=0;
function actx(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function resumeAC(){ const a=actx(); if(a&&a.state==='suspended'){ try{a.resume();}catch(e){} } refreshAudio(); return a; }
function beep(freq,dur,type,vol){
  if(muted||!sfxOn) return; const a=actx(); if(!a) return;
  try{
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.value=freq; g.gain.value=(vol||0.06);
    o.connect(g); g.connect(a.destination);
    const t=a.currentTime; g.gain.setValueAtTime(g.gain.value,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.1));
    o.start(t); o.stop(t+(dur||0.1)+0.02);
  }catch(e){}
}
const S={
  deploy:()=>beep(430,0.09,'triangle',0.07),
  hit:(dmg)=>{ const t=performance.now(); if(t-_lastHit<30) return; _lastHit=t;
    if((dmg||0)>=120){ beep(78,0.17,'square',0.10); beep(150,0.09,'triangle',0.05); }
    else beep(200+Math.random()*45,0.05,'triangle',0.035); },
  spell:(heavy)=>{ if(heavy){ beep(90,0.34,'sawtooth',0.10); beep(180,0.12,'square',0.05); } else beep(150,0.2,'sawtooth',0.07); },
  frost:()=>{ beep(900,0.18,'sine',0.05); beep(1300,0.24,'triangle',0.035); },
  roll:()=>beep(120,0.3,'triangle',0.06),
  tower:()=>{ beep(90,0.4,'square',0.12); setTimeout(()=>beep(64,0.45,'square',0.11),80); setTimeout(()=>beep(48,0.5,'sine',0.10),160); },
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'triangle',0.09),i*140)),
  lose:()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,0.28,'sine',0.09),i*180)),
};
const Music={
  a:null, master:null, padF:null, delay:null, timer:null, step:0, chord:0,
  stepMs:270, ticksPerChord:8,
  prog:[ {root:0,tones:[0,3,7]}, {root:-4,tones:[-4,0,3]}, {root:3,tones:[3,7,10]}, {root:-2,tones:[-2,2,5]} ],
  init(){
    const a=actx(); if(!a||this.a) return;
    try{
      const master=a.createGain(); master.gain.value=0;
      const comp=a.createDynamicsCompressor();
      comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=4; comp.attack.value=0.005; comp.release.value=0.25;
      master.connect(comp); comp.connect(a.destination);
      const padF=a.createBiquadFilter(); padF.type='lowpass'; padF.frequency.value=2400; padF.Q.value=0.4; padF.connect(master);
      const delay=a.createDelay(); delay.delayTime.value=0.30;
      const fb=a.createGain(); fb.gain.value=0.30; delay.connect(fb); fb.connect(delay); delay.connect(master);
      this.a=a; this.master=master; this.padF=padF; this.delay=delay; this.step=0; this.chord=this.prog.length-1;
    }catch(e){ this.a=null; }
  },
  note(dest,type,freq,t,dur,peak,atk,rel){
    const a=this.a, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(dest);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(peak,t+atk);
    if(dur-rel>atk) g.gain.setValueAtTime(peak,t+dur-rel);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.03);
  },
  chordAt(i){
    const a=this.a, t=a.currentTime, c=this.prog[i], dur=(this.stepMs*this.ticksPerChord)/1000;
    c.tones.forEach(s=>{ this.note(this.padF,'triangle',220*Math.pow(2,s/12),t,dur,0.085,0.35,0.6); });
    this.note(this.master,'sine',110*Math.pow(2,c.root/12),t,dur,0.16,0.05,0.4);
    this.note(this.master,'triangle',55*Math.pow(2,c.root/12),t,dur,0.06,0.06,0.4);
  },
  arpAt(){
    const c=this.prog[this.chord];
    const pat=[c.tones[0],c.tones[1],c.tones[2],c.tones[0]+12,c.tones[2],c.tones[1],c.tones[0]+12,c.tones[2]];
    const s=pat[this.step%pat.length], a=this.a, t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type='triangle'; o.frequency.value=440*Math.pow(2,s/12); o.connect(g); g.connect(this.master); g.connect(this.delay);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.06,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.32); o.start(t); o.stop(t+0.36);
  },
  tick(){ if(!this.a) return;
    if(this.step%this.ticksPerChord===0){ this.chord=(this.chord+1)%this.prog.length; this.chordAt(this.chord); }
    this.arpAt(); this.step++; },
  start(){ this.init(); refreshAudio(); },
  ensureRunning(){ if(this.a&&!this.timer){ this.timer=setInterval(()=>this.tick(),this.stepMs); this.tick(); } },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  setLevel(v){ if(!this.a) return; try{ this.master.gain.setTargetAtTime(v,this.a.currentTime,0.4); }catch(e){} }
};
function refreshAudio(){
  const on=!muted&&musicOn;
  const lvl=on?(state==='playing'?0.6:state==='paused'?0.22:state==='over'?0.36:0.30):0;
  Music.setLevel(lvl);
  if(lvl>0) Music.ensureRunning(); else Music.stop();
}
document.getElementById('mute').addEventListener('click',()=>{
  muted=!muted; document.getElementById('mute').textContent=muted?'🔇':'🔊'; refreshAudio();
});

/* ----------------------------- STORAGE ----------------------------- */
const STORE_KEY='bridgeBrawl_v2';
let stats={wins:0,losses:0,draws:0,crowns:0,games:0,history:[],deck:DEFAULT_DECK.slice(),difficulty:'medium'};
function loadStats(){
  try{
    const s=localStorage.getItem(STORE_KEY);
    if(s){ const p=JSON.parse(s); if(p&&typeof p==='object') stats=Object.assign(stats,p); }
  }catch(e){}
  if(!Array.isArray(stats.deck)) stats.deck=DEFAULT_DECK.slice();
  stats.deck=stats.deck.filter(k=>CARDS[k]);
  if(stats.deck.length!==8) stats.deck=DEFAULT_DECK.slice();
  difficulty=AI_LEVELS[stats.difficulty]?stats.difficulty:'medium';
}
function saveStats(){ try{ stats.difficulty=difficulty; localStorage.setItem(STORE_KEY,JSON.stringify(stats)); }catch(e){} }
function recordResult(r){
  const my=crownCount(1), foe=crownCount(-1);
  stats.games++; stats.crowns+=my;
  if(r==='victory') stats.wins++; else if(r==='defeat') stats.losses++; else stats.draws++;
  stats.history.unshift({r,my,foe,d:difficulty,t:Date.now()});
  if(stats.history.length>20) stats.history.length=20;
  saveStats();
}
function resetStats(){
  const d=stats.deck;
  stats={wins:0,losses:0,draws:0,crowns:0,games:0,history:[],deck:d,difficulty};
  saveStats();
}

/* ----------------------------- HELPERS ----------------------------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function sx(x){return arenaX+x*tile;}
function sy(y){return arenaY+y*tile;}
function toArena(px,py){return {x:(px-arenaX)/tile, y:(py-arenaY)/tile};}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r*f),0,255);g=clamp(Math.round(g*f),0,255);b=clamp(Math.round(b*f),0,255);
  return `rgb(${r},${g},${b})`;
}
function addShake(m){ shake=Math.min(16,Math.max(shake,m)); }
const nearestBridge=x=>Math.abs(x-BR_L)<Math.abs(x-BR_R)?BR_L:BR_R;
const onBridge=x=>Math.abs(x-BR_L)<=BRIDGE_HALF||Math.abs(x-BR_R)<=BRIDGE_HALF;
const inRiver=y=>Math.abs(y-RIVER)<0.95;

/* ----------------------------- LAYOUT ------------------------------ */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  TOP_H=Math.round(clamp(H*0.062,42,60));
  HUD_H=Math.round(clamp(H*0.20,128,186));
  const availH=H-TOP_H-HUD_H;
  tile=Math.min(W/TX,availH/TY);
  arenaW=tile*TX; arenaH=tile*TY;
  arenaX=(W-arenaW)/2; arenaY=TOP_H+(availH-arenaH)/2;
  buildBg(); buildSpriteCaches();
}

/* --------------------------- BG CACHE ------------------------------ */
function buildBg(){
  bg=document.createElement('canvas');
  bg.width=Math.round(arenaW*DPR); bg.height=Math.round(arenaH*DPR);
  const g=bg.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  const T=tile;
  for(let r=0;r<TY;r++){ g.fillStyle=(r%2===0)?COL.grassA:COL.grassB; g.fillRect(0,r*T,arenaW,T); }
  g.globalAlpha=0.10;
  for(let i=0;i<160;i++){
    const rx=Math.random()*arenaW, ry=Math.random()*arenaH;
    if(Math.abs(ry/T-RIVER)<1.1) continue;
    g.fillStyle=Math.random()<0.5?'#7cc25a':'#4c8c39'; g.fillRect(rx,ry,T*0.16,T*0.16);
  }
  g.globalAlpha=1;
  g.strokeStyle=COL.grassEdge; g.lineWidth=Math.max(2,T*0.12);
  g.strokeRect(g.lineWidth/2,g.lineWidth/2,arenaW-g.lineWidth,arenaH-g.lineWidth);
  const ry0=(RIVER-0.9)*T, rh=1.8*T;
  g.fillStyle=COL.water; g.fillRect(0,ry0,arenaW,rh);
  g.fillStyle=COL.waterHi; g.globalAlpha=0.5;
  for(let i=0;i<26;i++) g.fillRect(Math.random()*arenaW,ry0+Math.random()*rh,T*0.5,T*0.09);
  g.globalAlpha=1;
  g.fillStyle=COL.grassEdge; g.fillRect(0,ry0-T*0.14,arenaW,T*0.14); g.fillRect(0,ry0+rh,arenaW,T*0.14);
  [BR_L,BR_R].forEach(bx=>{
    const w=(BRIDGE_HALF*2+0.26)*T, x=bx*T-w/2;
    g.fillStyle=COL.woodDk; g.fillRect(x,ry0-T*0.2,w,rh+T*0.4);
    g.fillStyle=COL.wood;
    for(let p=0;p<9;p++) g.fillRect(x,ry0-T*0.2+p*(rh+T*0.4)/9,w,(rh+T*0.4)/9*0.7);
    g.strokeStyle=COL.woodDk; g.lineWidth=Math.max(1,T*0.05); g.strokeRect(x,ry0-T*0.2,w,rh+T*0.4);
  });
  for(const k in TOWERS_DEF){ const t=TOWERS_DEF[k];
    g.fillStyle='rgba(0,0,0,0.08)';
    g.beginPath(); g.ellipse(t.x*T,(t.y+(t.king?0.9:0.8))*T,T*(t.king?1.5:1.25),T*0.5,0,0,7); g.fill(); }
}

/* ------------------------- SPRITE CACHE ---------------------------- */
function mkCanvas(cssW,cssH){
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.ceil(cssW*DPR)); c.height=Math.max(1,Math.ceil(cssH*DPR));
  const g=c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  return {canvas:c,g,cw:cssW,ch:cssH};
}
function buildSpriteCaches(){
  UNIT_SPR={}; GROUND_SPR={};
  const T=tile;
  for(const key of UNIT_TYPES){
    const c=CARDS[key], draw=c.draw, R=c.radius*T;
    for(const team of [1,-1]){
      const gs=mkCanvas(R*2.8,R*2.8);
      gs.g.translate(gs.cw/2,gs.ch/2); paintGround(gs.g,R,team,T);
      GROUND_SPR[draw+'_'+team]=gs;
      for(const st of [0,1]){
        const bs=mkCanvas(R*4.4,R*5.0);
        bs.g.translate(bs.cw/2,bs.ch/2);
        paintUnitBody(bs.g,draw,R,team,c.color,st===1);
        UNIT_SPR[draw+'_'+team+'_'+st]=bs;
      }
    }
  }
}
function paintGround(g,R,team,T){
  g.fillStyle='rgba(0,0,0,0.22)';
  g.beginPath(); g.ellipse(0,R*0.55,R*0.95,R*0.42,0,0,7); g.fill();
  g.lineWidth=Math.max(2,T*0.09); g.strokeStyle=team===1?COL.pRing:COL.eRing;
  g.beginPath(); g.ellipse(0,R*0.55,R*0.92,R*0.4,0,0,7); g.stroke();
}
function paintUnitBody(g,draw,R,team,color,flash){
  const body=flash?'#ffffff':color;
  const bodyDk=flash?'#ffd0d0':shade(color,0.7);
  const teamCol=team===1?COL.pTower:COL.eTower;
  const ringCol=team===1?COL.pRing:COL.eRing;
  if(draw==='recruit'){

/* ------------------------------ DECK ------------------------------- */
function makeSide(team,deck){
  const q=shuffle(deck);
  return {team, elixir:6, hand:q.slice(0,4), pending:q.slice(4,8), aiTimer:1.2};
}
function playFromHand(side,slot){
  const played=side.hand[slot];
  side.hand[slot]=side.pending.shift(); side.pending.push(played);
  return played;
}

/* ------------------------------ MATCH ------------------------------ */
function startMatch(){
  units=[]; projectiles=[]; rollers=[]; fx=[]; floaters=[]; towers=[]; uid=1; shake=0;
  matchTime=0; overtime=false; result=''; sel=-1; dragging=false;
  player=makeSide(1, (Array.isArray(stats.deck)&&stats.deck.length===8)?stats.deck:DEFAULT_DECK);
  enemy=makeSide(-1,AI_DECKS[difficulty]);
  for(const k in TOWERS_DEF){
    const d=TOWERS_DEF[k], st=d.king?TOWER_STATS.king:TOWER_STATS.princess;
    towers.push({key:k,x:d.x,y:d.y,team:d.team,king:d.king,
      hp:st.hp,maxHp:st.hp,dispHp:st.hp,dmg:st.dmg,atk:st.atk,range:st.range,
      cd:0,active:d.king?false:true,alive:true,isTower:true,radius:d.king?1.1:0.9});
  }
  state='playing'; Music.start(); refreshAudio();
}

/* ------------------------------ SPAWN ------------------------------ */
function spawnCard(side,cardKey,x,y){
  const c=CARDS[cardKey];
  if(c.type==='spell'){ castSpell(side.team,cardKey,x,y); return; }
  const n=c.count||1, positions=formation(n,x,y,side.team);
  const dep=deployTime(c);
  for(let i=0;i<n;i++){
    const p=positions[i];
    units.push({
      id:uid++, team:side.team, card:cardKey, name:c.name, draw:c.draw, color:c.color,
      x:p.x, y:p.y, vx:0, vy:0,
      hp:c.hp, maxHp:c.hp, dispHp:c.hp, dmg:c.dmg, atk:c.atk, cd:c.atk*0.4,
      range:c.range, speed:c.speed||0, targets:c.targets||'any',
      air:!!c.air, hitAir:!!c.hitAir, ranged:!!c.ranged, splash:c.splash||0, slowOnHit:c.slow||0,
      isBuilding:c.type==='building', life:c.life||0, maxLife:c.life||0,
      radius:c.radius, stun:0, slow:0, kbY:0, kbT:0, deploy:dep, maxDeploy:dep,
      target:null, retargetCd:0, hitFlash:0, lunge:0, walk:c.type==='building'?0:Math.random()*6.28,
    });
  }
  S.deploy();
  puff(sx(x),sy(y),side.team===1?COL.pRing:COL.eRing);
}
function formation(n,x,y,team){
  if(n===1) return [{x,y}];
  if(n===2) return [{x:x-0.3,y},{x:x+0.3,y}];
  const out=[];
  for(let i=0;i<n;i++){ const col=(i%2)?1:-1, rank=(i>>1)+1;
    out.push({x:x+col*rank*0.42, y:y+Math.floor(i/2)*0.5*(-team)}); }
  return out;
}
function castSpell(team,key,x,y){
  const c=CARDS[key];
  if(c.mode==='roll'){
    rollers.push({x, y, dir:-team, team, dmg:c.dmg, push:c.push, width:c.width,
      range:c.range, speed:c.rollSpeed, traveled:0, spin:0, hit:{}});
    S.roll(); addShake(3);
    return;
  }
  if(key==='frost') S.frost(); else S.spell(key==='fireball');
  addShake(key==='fireball'?7:3.5);
  fx.push({type:'spell',x,y,r:c.radius,t:0,dur:0.5,color:c.color,key});
  for(const u of units){
    if(u.team===team||u.dead) continue;
    if(dist(u.x,u.y,x,y)<=c.radius+u.radius){
      damageUnit(u,c.dmg); u.hitFlash=0.2;
      if(c.stun) u.stun=Math.max(u.stun,c.stun);
      if(c.slow) u.slow=Math.max(u.slow,c.slow);
    }
  }
  for(const t of towers){
    if(!t.alive||t.team===team) continue;
    if(dist(t.x,t.y,x,y)<=c.radius+t.radius) damageTower(t,c.dmg*0.35);
  }
}

/* ----------------------------- COMBAT ------------------------------ */
function spawnDamage(x,y,amt,opts){
  opts=opts||{};
  floaters.push({x,y,amt:Math.round(amt),t:0,dur:opts.dur||0.85,color:opts.color||'#ffffff',big:!!opts.big});
}
function damageUnit(u,amt){
  if(u.dead) return;
  u.hp-=amt; u.hitFlash=0.12;
  spawnDamage(u.x,u.y-0.4,amt,{color:amt>=150?'#ffd23c':'#ffffff',big:amt>=150});
  if(u.hp<=0){ u.dead=true; puff(sx(u.x),sy(u.y),'#444',0.5); }
}
function damageTower(t,amt){
  if(!t.alive) return;
  t.hp-=amt; if(t.king) t.active=true;
  spawnDamage(t.x,t.y-0.6,amt,{color:'#ffd23c',big:amt>=150});
  if(t.hp<=0) killTower(t);
}
function killTower(t){
  if(!t.alive) return;
  t.alive=false; t.hp=0; S.tower(); addShake(9);
  for(let i=0;i<18;i++) fx.push({type:'debris',x:t.x+(Math.random()-0.5)*1.6,y:t.y+(Math.random()-0.5)*1.6,
    vx:(Math.random()-0.5)*3,vy:-Math.random()*4-1,t:0,dur:0.9,color:t.team===1?COL.pTower:COL.eTower});
  if(!t.king){
    const king=towers.find(x=>x.key===(t.team===1?'pKing':'eKing'));
    if(king) king.active=true;
  }
}
function validTarget(u,e){
  if(e.dead||e.alive===false) return false;
  if(e.team===u.team) return false;
  if(u.targets==='units' && e.isTower) return false;
  if(u.targets==='buildings' && !e.isTower && !e.isBuilding) return false;
  if(e.air && !u.hitAir) return false;
  return true;
}
function acquire(u){
  const canTower = u.targets!=='units';
  if(u.targets==='buildings'){
    let best=null,bd=1e9;
    for(const e of units){ if(!e.isBuilding||!validTarget(u,e)) continue;
      const d=dist(u.x,u.y,e.x,e.y); if(d<bd){bd=d;best=e;} }
    for(const t of towers){ if(!validTarget(u,t)) continue;
      const d=dist(u.x,u.y,t.x,t.y); if(d<bd){bd=d;best=t;} }
    return best;
  }
  const aggro=u.ranged?6.5:5.5;
  let bu=null,bud=1e9;
  for(const e of units){ if(!validTarget(u,e)) continue;
    const d=dist(u.x,u.y,e.x,e.y); if(d<bud){bud=d;bu=e;} }
  if(bu && bud<=Math.max(aggro,u.range+1)) return bu;
  if(canTower){
    let bt=null,btd=1e9;
    for(const t of towers){ if(!validTarget(u,t)) continue;
      const d=dist(u.x,u.y,t.x,t.y); if(d<btd){btd=d;bt=t;} }
    if(bt) return bt;
  }
  return bu;
}

/* ---------------------------- STEERING -----------------------------
   Neighbor grid + seek/separation/funnel steering with smoothed velocity.
   Bridges are hard corridors so nobody gets squeezed onto the railings.
   ------------------------------------------------------------------- */
let grid=new Map();
function buildGrid(){
  grid.clear();
  for(const u of units){
    if(u.dead) continue;
    const k=(u.x|0)+','+(u.y|0);
    let a=grid.get(k); if(!a){ a=[]; grid.set(k,a); }
    a.push(u);
  }
}
function forEachNeighbor(u,fn){
  const gx=u.x|0, gy=u.y|0;
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    const a=grid.get((gx+i)+','+(gy+j));
    if(a) for(let n=0;n<a.length;n++) fn(a[n]);
  }
}
function bridgeFor(u,t){
  const dl=Math.abs(u.x-BR_L)+0.6*Math.abs(t.x-BR_L);
  const dr=Math.abs(u.x-BR_R)+0.6*Math.abs(t.x-BR_R);
  return dl<=dr?BR_L:BR_R;
}
function pathPoint(u,t){
  if(u.air) return {x:t.x,y:t.y};
  const above=u.y<RIVER, tAbove=t.y<RIVER;
  if(above===tAbove) return {x:t.x,y:t.y};
  const bx=bridgeFor(u,t);
  const approach=RIVER+(above?-1.9:1.9);
  const exit=RIVER+(above?1.9:-1.9);
  if(Math.abs(u.x-bx)>0.4 && Math.abs(u.y-RIVER)>1.6) return {x:bx,y:approach};
  return {x:bx,y:exit};
}
function steerUnit(u,dt){
  const t=u.target; if(!t) return;
  const wp=pathPoint(u,t);
  let dx=wp.x-u.x, dy=wp.y-u.y; const d=Math.hypot(dx,dy)||1;
  let sxv=dx/d, syv=dy/d;

  // separation (only against same layer: ground vs ground, air vs air)
  let sepx=0, sepy=0, n=0;
  forEachNeighbor(u,o=>{
    if(o===u||o.dead||o.air!==u.air) return;
    const ddx=u.x-o.x, ddy=u.y-o.y;
    const dd=Math.hypot(ddx,ddy);
    const mind=(u.radius+o.radius)*1.06;
    if(dd<mind && dd>0.0001){
      const w=(mind-dd)/mind*(o.isBuilding?1.7:1);
      sepx+=ddx/dd*w; sepy+=ddy/dd*w; n++;
    }
  });
  if(n){ sepx/=n; sepy/=n; }

  // bridge funnel: near the river, steer toward the bridge centre line
  let fnx=0;
  if(!u.air){
    const band=Math.abs(u.y-RIVER);
    if(band<2.6){
      const bx=nearestBridge(u.x);
      fnx=clamp(bx-u.x,-1,1)*(1-band/2.6)*1.8;
    }
  }

  let vx=sxv+sepx*1.9+fnx, vy=syv+sepy*1.9;
  const vl=Math.hypot(vx,vy)||1; vx/=vl; vy/=vl;
  const spd=u.speed*(u.slow>0?0.45:1);
  const turn=1-Math.exp(-11*dt);
  u.vx+=(vx*spd-u.vx)*turn;
  u.vy+=(vy*spd-u.vy)*turn;

  let px=u.x+u.vx*dt, py=u.y+u.vy*dt;
  if(!u.air){
    if(inRiver(py)&&!onBridge(px)){ py=u.y; }          // can't wade in
    if(inRiver(py)){                                    // on the bridge: stay on the deck
      const bx=nearestBridge(px);
      px=clamp(px,bx-BRIDGE_HALF,bx+BRIDGE_HALF);
    }
  }
  u.x=clamp(px,0.4,TX-0.4); u.y=clamp(py,0.4,TY-0.4);
  u.walk+=dt*Math.hypot(u.vx,u.vy)*6;
}
function applyKnockback(u,dt){
  u.kbT-=dt;
  let py=u.y+u.kbY*dt;
  if(!u.air){
    if(inRiver(py)&&!onBridge(u.x)) py=u.y;
    if(inRiver(py)){ const bx=nearestBridge(u.x); u.x=clamp(u.x,bx-BRIDGE_HALF,bx+BRIDGE_HALF); }
  }
  u.y=clamp(py,0.4,TY-0.4);
}
function unitAttack(u){
  const t=u.target; if(!t) return;
  if(dist(u.x,u.y,t.x,t.y)>u.range+u.radius+(t.radius||0.3)) return;
  if(u.cd>0) return;
  u.cd=u.atk*(u.slow>0?1.6:1);
  if(u.ranged){
    projectiles.push({x:u.x,y:u.y,tx:t.x,ty:t.y,target:t,team:u.team,
      dmg:u.dmg,splash:u.splash,slow:u.slowOnHit,speed:9,color:u.color,r:0.22,kind:u.draw});
  } else { dealHit(u,t,u.dmg); u.lunge=0.12; S.hit(u.dmg); }
}
function dealHit(src,t,dmg){
  if(src.splash){
    for(const o of units){
      if(o.team===src.team||o.dead) continue;
      if(o.air&&!src.hitAir) continue;
      if(dist(o.x,o.y,t.x,t.y)<=src.splash+o.radius) damageUnit(o,dmg);
    }
    if(t.isTower) damageTower(t,dmg);
  } else {
    if(t.isTower) damageTower(t,dmg); else damageUnit(t,dmg);
  }
  fx.push({type:'spark',x:t.x,y:t.y,t:0,dur:0.18,color:src.team===1?COL.pRing:COL.eRing});
}
function updateProjectiles(dt){
  for(const p of projectiles){
    if(p.target&&!p.target.dead&&p.target.alive!==false){ p.tx=p.target.x; p.ty=p.target.y; }
    const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy)||1, step=p.speed*dt;
    if(d<=step){ p.hit=true; impact(p); } else { p.x+=dx/d*step; p.y+=dy/d*step; }
  }
  projectiles=projectiles.filter(p=>!p.hit);
}
function impact(p){
  fx.push({type:'spark',x:p.tx,y:p.ty,t:0,dur:0.16,color:p.color});
  S.hit(p.splash?Math.max(p.dmg,140):p.dmg);
  if(p.splash){
    addShake(2);
    for(const u of units){ if(u.team===p.team||u.dead) continue;
      if(dist(u.x,u.y,p.tx,p.ty)<=p.splash+u.radius){ damageUnit(u,p.dmg); if(p.slow) u.slow=Math.max(u.slow,p.slow); } }
    for(const t of towers){ if(!t.alive||t.team===p.team) continue;
      if(dist(t.x,t.y,p.tx,p.ty)<=p.splash+t.radius) damageTower(t,p.dmg); }
    fx.push({type:'spell',x:p.tx,y:p.ty,r:p.splash,t:0,dur:0.3,color:p.color});
  } else if(p.target){
    const t=p.target; if(t.dead||t.alive===false) return;
    if(t.isTower) damageTower(t,p.dmg);
    else { damageUnit(t,p.dmg); if(p.slow) t.slow=Math.max(t.slow,p.slow); }
  }
}
function updateRollers(dt){
  for(const r of rollers){
    r.y+=r.dir*r.speed*dt;
    r.traveled+=r.speed*dt;
    r.spin+=dt*r.speed*1.6;
    for(const u of units){
      if(u.dead||u.team===r.team||u.air) continue;
      if(r.hit[u.id]) continue;
      if(Math.abs(u.x-r.x)<=r.width/2+u.radius && Math.abs(u.y-r.y)<=0.55+u.radius){
        r.hit[u.id]=1;
        damageUnit(u,r.dmg);
        if(!u.isBuilding){ u.kbY=r.dir*r.push; u.kbT=0.32; u.vx=0; u.vy=0; }
      }
    }
    if(r.traveled>=r.range||r.y<0.4||r.y>TY-0.4) r.done=true;
  }
  rollers=rollers.filter(r=>!r.done);
}
function updateTowers(dt){
  for(const t of towers){
    if(t.alive) t.dispHp+=(t.hp-t.dispHp)*Math.min(1,6*dt);
    if(!t.alive) continue;
    if(t.king&&!t.active) continue;
    t.cd-=dt;
    let best=null,bd=1e9;
    for(const u of units){ if(u.dead||u.team===t.team) continue;
      const d=dist(t.x,t.y,u.x,u.y); if(d<=t.range&&d<bd){bd=d;best=u;} }
    if(best&&t.cd<=0){ t.cd=t.atk;
      projectiles.push({x:t.x,y:t.y+(t.team===1?-0.2:0.2),tx:best.x,ty:best.y,target:best,team:t.team,
        dmg:t.dmg,splash:0,slow:0,speed:11,color:t.team===1?COL.pRing:COL.eRing,r:0.18,kind:'bolt'}); }
  }
}

/* -------------------------------- FX ------------------------------- */
function puff(px,py,color,scale){ fx.push({type:'puff',px,py,t:0,dur:0.35,color:color||'#fff',scale:scale||1}); }
function updateFx(dt){
  for(const f of fx){ f.t+=dt; if(f.type==='debris'){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=10*dt; } }
  fx=fx.filter(f=>f.t<f.dur);
  for(const f of floaters) f.t+=dt;
  floaters=floaters.filter(f=>f.t<f.dur);
}
function updateElixir(side,dt){
  const base=(matchTime>=MATCH_LEN-DOUBLE_AT||overtime)?1/1.4:1/2.8;
  const mul=side.team===-1?AI_LEVELS[difficulty].elixirMul:1;
  side.elixir=Math.min(10,side.elixir+base*mul*dt);
}

/* -------------------------------- AI ------------------------------- */
function aiThink(dt){
  const s=enemy, cfg=AI_LEVELS[difficulty];
  s.aiTimer-=dt; if(s.aiTimer>0) return;

  let threat=null,tv=0;
  for(const u of units){ if(u.team!==1||u.dead) continue;
    if(u.y<RIVER+4 && u.hp>tv){ tv=u.hp; threat=u; } }
  let cx=9,cy=8,cnt=0;
  for(const u of units){ if(u.team!==1||u.dead||u.y>RIVER+5) continue;
    let c=0; for(const o of units){ if(o.team===1&&!o.dead&&dist(o.x,o.y,u.x,u.y)<2.0) c++; }
    if(c>cnt){ cnt=c; cx=u.x; cy=u.y; } }

  const aff=[]; s.hand.forEach((k,i)=>{ if(CARDS[k].cost<=s.elixir) aff.push({k,i}); });
  if(!aff.length){ s.aiTimer=0.4; return; }
  const has=k=>aff.find(a=>a.k===k);
  let pick=null, px=9, py=8;

  if(cnt>=cfg.spellMin && cy<RIVER+4){
    const sp=has('fireball')||has('frost')||has('jolt');
    if(sp){ pick=sp; px=cx; py=cy; }
  }
  if(!pick && cnt>=2 && cy<RIVER+3 && has('log')){ pick=has('log'); px=cx; py=cy-2.0; }
  if(!pick && threat && tv>900 && has('cannon')){
    pick=has('cannon'); px=clamp(threat.x<9?6.8:11.2,2,16); py=RIVER-3.5;
  }
  if(!pick && threat && tv>cfg.threatHp && Math.random()<cfg.defend){
    for(const k of ['bomber','whirl','slings','ratlings','recruit','wisps','brute','cannon']){
      const a=has(k); if(a){ pick=a; break; } }
    if(pick){ px=clamp(threat.x,2,16); py=clamp(RIVER-2.2,5,RIVER-1); }
  }
  if(!pick && s.elixir>=cfg.pushAt){
    const g=has('golem')||has('brute');
    if(g){ pick=g; px=Math.random()<0.5?BR_L:BR_R; py=3.5; }
  }
  if(!pick && s.elixir>=5){
    const tank=units.find(u=>u.team===-1&&!u.dead&&(u.card==='golem'||u.card==='brute'));
    for(const k of ['bomber','slings','wisps','whirl','ratlings','recruit']){
      const a=has(k); if(a){ pick=a; break; } }
    if(pick){
      if(tank){ px=clamp(tank.x,2,16); py=clamp(tank.y-1.2,3,RIVER-1); }
      else { px=Math.random()<0.5?BR_L:BR_R; py=6.2; }
    }
  }

  if(pick){
    if(cfg.mistake>0&&Math.random()<cfg.mistake) px=clamp(px+(Math.random()*4-2),1,TX-1);
    const c=CARDS[pick.k];
    if(c.type!=='spell'){
      let maxY=RIVER-0.6;
      if(px<9&&!towers.find(t=>t.key==='pL').alive) maxY=RIVER+7;
      if(px>=9&&!towers.find(t=>t.key==='pR').alive) maxY=RIVER+7;
      py=clamp(py,0.6,maxY); px=clamp(px,1,TX-1);
    }
    const key=playFromHand(s,pick.i); s.elixir-=CARDS[key].cost;
    spawnCard(s,key,px,py);
    s.aiTimer=cfg.delayMin+Math.random()*cfg.delayRand;
  } else s.aiTimer=0.5;
}

/* ------------------------------- WIN ------------------------------- */
function crownCount(team){ let c=0; for(const t of towers){ if(t.team===-team&&!t.alive) c+=t.king?3:1; } return c; }
function checkEnd(){
  const pKing=towers.find(t=>t.key==='pKing'), eKing=towers.find(t=>t.key==='eKing');
  if(!eKing.alive){ endMatch('victory'); return; }
  if(!pKing.alive){ endMatch('defeat'); return; }
  if(matchTime>=MATCH_LEN&&!overtime){
    const pc=crownCount(1), ec=crownCount(-1);
    if(pc!==ec){ endMatch(pc>ec?'victory':'defeat'); return; }
    overtime=true; matchTime=MATCH_LEN; fx.push({type:'banner',t:0,dur:2,text:'OVERTIME!'});
  }
  if(overtime){
    const pc=crownCount(1), ec=crownCount(-1);
    if(matchTime>=MATCH_LEN+OVERTIME){
      if(pc!==ec){ endMatch(pc>ec?'victory':'defeat'); return; }
      const pf=pKing.hp/pKing.maxHp, ef=eKing.hp/eKing.maxHp;
      endMatch(pf>ef?'victory':(ef>pf?'defeat':'draw')); return;
    }
    if(pc!==ec) endMatch(pc>ec?'victory':'defeat');
  }
}
function endMatch(r){
  if(state==='over') return;
  result=r; recordResult(r); state='over'; refreshAudio();
  if(r==='victory') S.win(); else if(r==='defeat') S.lose();
}

/* ------------------------------ UPDATE ----------------------------- */
function update(dt){
  if(state!=='playing') return;
  matchTime+=dt;
  shake=Math.max(0,shake-34*dt);
  updateElixir(player,dt); updateElixir(enemy,dt);
  aiThink(dt);
  buildGrid();

  for(const u of units){
    if(u.dead) continue;
    u.dispHp+=(u.hp-u.dispHp)*Math.min(1,8*dt);
    if(u.hitFlash>0) u.hitFlash-=dt;
    if(u.lunge>0) u.lunge-=dt;
    if(u.slow>0) u.slow-=dt;
    if(u.deploy>0){ u.deploy-=dt; continue; }   // spawning: visible + targetable, but inert
    if(u.isBuilding){
      u.life-=dt;
      if(u.life<=0){ u.dead=true; puff(sx(u.x),sy(u.y),'#8a8a8a',0.8); continue; }
    }
    if(u.kbT>0){ applyKnockback(u,dt); continue; }
    if(u.stun>0){ u.stun-=dt; continue; }
    u.cd-=dt;
    u.retargetCd-=dt;
    if(u.retargetCd<=0||!u.target||u.target.dead||u.target.alive===false||!validTarget(u,u.target)){
      u.target=acquire(u); u.retargetCd=0.2;
    }
    if(u.target){
      const reach=u.range+u.radius+(u.target.radius||0.3);
      const d=dist(u.x,u.y,u.target.x,u.target.y);
      if(d>reach){ if(!u.isBuilding) steerUnit(u,dt); }
      else unitAttack(u);
    }
  }
  units=units.filter(u=>!u.dead);

  updateProjectiles(dt);
  updateRollers(dt);
  updateTowers(dt);
  updateFx(dt);
  checkEnd();
}

/* ------------------------------ RENDER ----------------------------- */
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d1119'; ctx.fillRect(0,0,W,H);
  if(state==='menu'||state==='help'||state==='stats'||state==='deck'){ drawMenu(); return; }

  const shx=shake?(Math.random()*2-1)*shake:0, shy=shake?(Math.random()*2-1)*shake:0;
  ctx.save(); ctx.translate(shx,shy);
  ctx.drawImage(bg,arenaX,arenaY,arenaW,arenaH);
  if(sel>=0&&CARDS[player.hand[sel]].type!=='spell') drawDeployZone();
  for(const t of towers) drawTower(t);
  const sorted=units.slice().sort((a,b)=>a.y-b.y);
  for(const u of sorted) drawUnit(u);
  for(const r of rollers) drawRoller(r);
  for(const p of projectiles) drawProjectile(p);
  for(const f of fx) if(f.type!=='banner') drawFx(f);
  for(const f of floaters) drawFloater(f);
  ctx.restore();

  if(dragging&&sel>=0) drawGhost();
  for(const f of fx){ if(f.type==='banner'){
    const k=f.t/f.dur; ctx.globalAlpha=k<0.15?k/0.15:(k>0.7?(1-k)/0.3:1);
    ctx.fillStyle='#ffd23c'; ctx.font=`bold ${Math.round(H*0.07)}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.text,W/2,arenaY+arenaH*0.4); ctx.globalAlpha=1;
  }}
  drawTopBar(); drawHUD();
  if(state==='paused') drawPause();
  if(state==='over') drawOver();
}
function drawUnit(u){
  const T=tile, X=sx(u.x), Y=sy(u.y), R=u.radius*T, face=u.team===1?-1:1;
  const gs=GROUND_SPR[u.draw+'_'+u.team];
  if(gs) ctx.drawImage(gs.canvas,X-gs.cw/2,Y-gs.ch/2,gs.cw,gs.ch);
  const bob=u.isBuilding?0:Math.sin(u.walk)*T*0.06;
  const lung=(u.lunge>0?u.lunge/0.12:0)*T*0.18;
  const airf=u.air?Math.sin(now*0.004+u.id)*T*0.15:0;
  const cy=Y-R*0.5+bob+airf+lung*face;
  const st=u.hitFlash>0?1:0, bs=UNIT_SPR[u.draw+'_'+u.team+'_'+st];
  if(bs) ctx.drawImage(bs.canvas,X-bs.cw/2,cy-bs.ch/2,bs.cw,bs.ch);

  if(u.slow>0){
    ctx.save(); ctx.globalAlpha=0.32; ctx.fillStyle=COL.frost;
    ctx.beginPath(); ctx.arc(X,cy,R*1.02,0,7); ctx.fill();
    ctx.globalAlpha=0.75; ctx.strokeStyle='#ffffff'; ctx.lineWidth=Math.max(1,T*0.05);
    ctx.beginPath(); ctx.arc(X,Y+R*0.5,R*0.85,0,7); ctx.stroke();
    ctx.restore();
  }
  if(u.stun>0){
    ctx.save(); ctx.strokeStyle='#ffe14d'; ctx.lineWidth=Math.max(1.5,T*0.06); ctx.globalAlpha=0.9;
    for(let i=0;i<3;i++){ const a=now*0.008+i*2.1;
      ctx.beginPath(); ctx.arc(X+Math.cos(a)*R*0.9,cy-R*1.25,R*0.13,0,7); ctx.stroke(); }
    ctx.restore();
  }
  if(u.deploy>0){
    const k=clamp(1-u.deploy/(u.maxDeploy||1),0,1), cr=R*0.8;
    ctx.save();
    ctx.globalAlpha=0.55*(1-k)+0.15;
    ctx.strokeStyle=u.team===1?COL.pRing:COL.eRing;
    ctx.lineWidth=Math.max(1.5,T*0.07);
    const gs2=0.45+k*0.75;
    ctx.beginPath(); ctx.ellipse(X,Y+R*0.55,R*0.95*gs2,R*0.42*gs2,0,0,7); ctx.stroke();
    ctx.globalAlpha=0.9;
    ctx.fillStyle='rgba(8,12,20,0.66)';
    ctx.beginPath(); ctx.arc(X,cy,cr,0,7); ctx.fill();
    ctx.fillStyle=u.team===1?COL.pRing:COL.eRing;
    ctx.beginPath(); ctx.moveTo(X,cy);
    ctx.arc(X,cy,cr,-Math.PI/2,-Math.PI/2+k*Math.PI*2); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.lineWidth=Math.max(1.5,T*0.05);
    ctx.beginPath(); ctx.arc(X,cy,cr,0,7); ctx.stroke();
    ctx.restore();
  }
  if(u.dispHp<u.maxHp-0.5){
    const bw=R*1.8, bx=X-bw/2, by=Y-R*1.9+bob, bh=T*0.16;
    ctx.fillStyle='rgba(0,0,0,0.5)'; rr(ctx,bx-1,by-1,bw+2,bh+2,3); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)'; rr(ctx,bx,by,bw*clamp(u.dispHp/u.maxHp,0,1),bh,2); ctx.fill();
    ctx.fillStyle=u.team===1?'#4fd06a':'#ff6a5a'; rr(ctx,bx,by,bw*clamp(u.hp/u.maxHp,0,1),bh,2); ctx.fill();
  }
  if(u.isBuilding&&u.maxLife){
    const bw=R*1.8, bx=X-bw/2, by=Y-R*1.9+(u.dispHp<u.maxHp-0.5?tile*0.22:0), bh=tile*0.09;
    ctx.fillStyle='rgba(0,0,0,0.45)'; rr(ctx,bx-1,by-1,bw+2,bh+2,2); ctx.fill();
    ctx.fillStyle=u.life<6?'#ff9a3c':'#ffd23c'; rr(ctx,bx,by,bw*clamp(u.life/u.maxLife,0,1),bh,2); ctx.fill();
  }
}
function drawTower(t){
  const T=tile, X=sx(t.x), Y=sy(t.y);
  const base=t.team===1?COL.pTower:COL.eTower, dk=shade(base,0.65);
  const w=(t.king?2.4:1.9)*T, h=(t.king?2.6:2.1)*T, x=X-w/2, y=Y-h*0.62;
  if(!t.alive){
    ctx.fillStyle='rgba(60,50,45,0.85)'; rr(ctx,x+w*0.1,y+h*0.55,w*0.8,h*0.4,6); ctx.fill();
    ctx.fillStyle='rgba(40,32,28,0.9)';
    for(let i=0;i<5;i++) ctx.fillRect(x+w*0.15+i*w*0.15,y+h*0.6+((i%2)*h*0.12),w*0.12,h*0.16);
    return;
  }
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(X,Y+h*0.32,w*0.55,h*0.14,0,0,7); ctx.fill();
  ctx.fillStyle=dk; rr(ctx,x,y,w,h,T*0.25); ctx.fill();
  ctx.fillStyle=base; rr(ctx,x+w*0.08,y+h*0.06,w*0.84,h*0.9,T*0.22); ctx.fill();
  ctx.fillStyle=dk; const merl=w/5;
  for(let i=0;i<5;i++) if(i%2===0) ctx.fillRect(x+i*merl,y-T*0.28,merl,T*0.4);
  ctx.fillStyle=t.king?(t.active?'#ffe14d':'#3a3f4a'):'#2a2f38'; rr(ctx,X-w*0.14,y+h*0.28,w*0.28,h*0.3,T*0.1); ctx.fill();
  if(t.king){ ctx.fillStyle='#ffd23c'; const cy=y-T*0.35;
    ctx.beginPath(); ctx.moveTo(X-w*0.2,cy); ctx.lineTo(X-w*0.2,cy-T*0.4); ctx.lineTo(X-w*0.08,cy-T*0.1);
    ctx.lineTo(X,cy-T*0.5); ctx.lineTo(X+w*0.08,cy-T*0.1); ctx.lineTo(X+w*0.2,cy-T*0.4); ctx.lineTo(X+w*0.2,cy);
    ctx.closePath(); ctx.fill(); }
  const bw=w*0.9, bx=X-bw/2, by=y-T*0.55, bh=T*0.28;
  ctx.fillStyle='rgba(0,0,0,0.55)'; rr(ctx,bx-2,by-2,bw+4,bh+4,4); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)'; rr(ctx,bx,by,bw*clamp(t.dispHp/t.maxHp,0,1),bh,3); ctx.fill();
  ctx.fillStyle=t.team===1?'#4fd06a':'#ff6a5a'; rr(ctx,bx,by,bw*clamp(t.hp/t.maxHp,0,1),bh,3); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(T*0.42)}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(Math.max(0,Math.ceil(t.hp)),X,by+bh/2);
}
function drawRoller(r){
  const T=tile, X=sx(r.x), Y=sy(r.y), w=r.width*T, h=T*0.85;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(X,Y+h*0.45,w*0.5,h*0.22,0,0,7); ctx.fill();
  ctx.fillStyle=COL.woodDk; rr(ctx,X-w/2,Y-h/2,w,h,h*0.42); ctx.fill();
  ctx.fillStyle=COL.wood; rr(ctx,X-w/2+2,Y-h/2+2,w-4,h-4,h*0.4); ctx.fill();
  ctx.strokeStyle=COL.woodDk; ctx.lineWidth=Math.max(1.5,T*0.06);
  for(let i=0;i<4;i++){
    const off=((r.spin*0.5+i/4)%1)*w-w/2;
    ctx.beginPath(); ctx.moveTo(X+off,Y-h/2+3); ctx.lineTo(X+off,Y+h/2-3); ctx.stroke();
  }
  ctx.restore();
}
function drawProjectile(p){
  const T=tile, X=sx(p.x), Y=sy(p.y);
  if(p.kind==='bolt'){
    ctx.strokeStyle=p.color; ctx.lineWidth=T*0.14; ctx.lineCap='round';
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1;
    ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X-dx/d*T*0.5,Y-dy/d*T*0.5); ctx.stroke();
  } else {
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(X,Y,p.r*T,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(X-p.r*T*0.3,Y-p.r*T*0.3,p.r*T*0.4,0,7); ctx.fill();
  }
}
function drawFloater(f){
  const k=f.t/f.dur, px=sx(f.x), py=sy(f.y)-k*tile*1.5;
  ctx.globalAlpha=k<0.12?k/0.12:(1-k);
  const size=Math.round(tile*(f.big?0.85:0.55));
  ctx.font=`bold ${size}px "Trebuchet MS",system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(2,size*0.14); ctx.strokeStyle='rgba(0,0,0,0.75)';
  ctx.strokeText('-'+f.amt,px,py); ctx.fillStyle=f.color; ctx.fillText('-'+f.amt,px,py);
  ctx.globalAlpha=1;
}
function drawFx(f){
  const T=tile;
  if(f.type==='puff'){ const k=f.t/f.dur; ctx.globalAlpha=(1-k)*0.8; ctx.fillStyle=f.color;
    ctx.beginPath(); ctx.arc(f.px,f.py,(0.4+k*1.2)*T*(f.scale||1),0,7); ctx.fill(); ctx.globalAlpha=1;
  } else if(f.type==='spark'){ const k=f.t/f.dur; ctx.globalAlpha=1-k; ctx.strokeStyle=f.color; ctx.lineWidth=T*0.12;
    const X=sx(f.x),Y=sy(f.y);
    for(let i=0;i<5;i++){ const a=i/5*6.28, r=(0.2+k*0.9)*T; ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X+Math.cos(a)*r,Y+Math.sin(a)*r); ctx.stroke(); }
    ctx.globalAlpha=1;
  } else if(f.type==='spell'){ const k=f.t/f.dur, X=sx(f.x), Y=sy(f.y); ctx.globalAlpha=(1-k)*0.85;
    if(f.key==='jolt'){ ctx.strokeStyle=f.color; ctx.lineWidth=T*0.16;
      for(let i=0;i<8;i++){ const a=i/8*6.28+k*2, r=f.r*T*(0.4+k*0.8);
        ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X+Math.cos(a)*r,Y+Math.sin(a)*r); ctx.stroke(); }
    } else if(f.key==='frost'){
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=T*0.09;
      const rr2=f.r*T*(0.5+k*0.8);
      ctx.globalAlpha=(1-k)*0.6; ctx.fillStyle=COL.frost;
      ctx.beginPath(); ctx.arc(X,Y,rr2,0,7); ctx.fill();
      ctx.globalAlpha=(1-k)*0.95;
      for(let i=0;i<6;i++){ const a=i/6*6.28+k;
        ctx.beginPath(); ctx.moveTo(X+Math.cos(a)*rr2*0.3,Y+Math.sin(a)*rr2*0.3);
        ctx.lineTo(X+Math.cos(a)*rr2,Y+Math.sin(a)*rr2); ctx.stroke(); }
    } else { const g=ctx.createRadialGradient(X,Y,T*0.2,X,Y,f.r*T*(0.6+k*0.7));
      g.addColorStop(0,'rgba(255,220,120,0.9)'); g.addColorStop(0.6,f.color); g.addColorStop(1,'rgba(255,80,20,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(X,Y,f.r*T*(0.6+k*0.7),0,7); ctx.fill(); }
    ctx.globalAlpha=1;
  } else if(f.type==='debris'){ const k=f.t/f.dur; ctx.globalAlpha=1-k; ctx.fillStyle=f.color;
    ctx.fillRect(sx(f.x),sy(f.y),T*0.22,T*0.22); ctx.globalAlpha=1; }
}
function drawDeployZone(){
  ctx.save(); ctx.globalAlpha=0.10; ctx.fillStyle=COL.pRing;
  const eLdown=!towers.find(t=>t.key==='eL').alive, eRdown=!towers.find(t=>t.key==='eR').alive;
  ctx.fillRect(sx(0.4),sy(RIVER+0.6),arenaW-tile*0.8,sy(TY-0.4)-sy(RIVER+0.6));
  if(eLdown) ctx.fillRect(sx(0.4),sy(0.6),arenaW/2-tile*0.4,sy(RIVER+0.6)-sy(0.6));
  if(eRdown) ctx.fillRect(sx(9),sy(0.6),arenaW/2-tile*0.4,sy(RIVER+0.6)-sy(0.6));
  ctx.restore();
}
function isValidDeploy(x,y,c){
  if(x<0.6||x>TX-0.6||y<0.6||y>TY-0.6) return false;
  if(c.type==='spell') return true;
  if(y>RIVER+0.5) return true;
  const eLdown=!towers.find(t=>t.key==='eL').alive, eRdown=!towers.find(t=>t.key==='eR').alive;
  if(eLdown&&x<9&&y>6) return true;
  if(eRdown&&x>=9&&y>6) return true;
  return false;
}
function drawGhost(){
  const a=toArena(drag.x,drag.y-tile*1.6), gx=a.x, gy=a.y;
  const c=CARDS[player.hand[sel]], valid=isValidDeploy(gx,gy,c), T=tile, X=sx(gx), Y=sy(gy);
  if(c.mode==='roll'){
    const w=c.width*T, len=c.range*T, dir=-1;
    ctx.save();
    ctx.globalAlpha=0.22; ctx.fillStyle=c.color;
    ctx.fillRect(X-w/2, Y+(dir<0?-len:0), w, len);
    ctx.globalAlpha=0.9; ctx.strokeStyle=valid?c.color:'#ff7a7a'; ctx.lineWidth=2.5;
    ctx.setLineDash([T*0.35,T*0.3]); ctx.lineDashOffset=-now*0.02;
    ctx.strokeRect(X-w/2, Y+(dir<0?-len:0), w, len);
    ctx.setLineDash([]);
    ctx.globalAlpha=0.95; ctx.fillStyle='#fff';
    for(let i=1;i<=3;i++){
      const ay=Y-len*(i/4);
      ctx.beginPath(); ctx.moveTo(X-T*0.28,ay+T*0.22); ctx.lineTo(X,ay-T*0.16); ctx.lineTo(X+T*0.28,ay+T*0.22); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha=0.9; drawCardIcon(c,X,Y+T*0.5,T*0.6); ctx.globalAlpha=1;
  } else if(c.type==='spell'){
    const rad=c.radius*T, pulse=0.5+0.5*Math.sin(now*0.006);
    const g=ctx.createRadialGradient(X,Y,rad*0.1,X,Y,rad);
    g.addColorStop(0,c.draw==='jolt'?'rgba(255,225,77,0.30)':(c.draw==='frost'?'rgba(143,228,255,0.32)':'rgba(255,140,50,0.32)'));
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(X,Y,rad,0,7); ctx.fill();
    ctx.globalAlpha=0.95; ctx.strokeStyle=valid?c.color:'#ff7a7a'; ctx.lineWidth=2+pulse*2;
    ctx.beginPath(); ctx.arc(X,Y,rad,0,7); ctx.stroke();
    ctx.save(); ctx.setLineDash([T*0.4,T*0.35]); ctx.lineDashOffset=-now*0.02; ctx.lineWidth=2;
    ctx.globalAlpha=0.6; ctx.strokeStyle=c.color; ctx.beginPath(); ctx.arc(X,Y,rad*0.82,0,7); ctx.stroke(); ctx.restore();
    ctx.globalAlpha=0.85; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(X-9,Y); ctx.lineTo(X+9,Y); ctx.moveTo(X,Y-9); ctx.lineTo(X,Y+9); ctx.stroke();
    ctx.globalAlpha=1;
  } else {
    ctx.globalAlpha=0.85; ctx.strokeStyle=valid?'#7fffa0':'#ff7a7a'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(X,Y,T*1.2,T*0.6,0,0,7); ctx.stroke();
    ctx.globalAlpha=0.9; drawCardIcon(c,X,Y-T*0.6,T*0.7); ctx.globalAlpha=1;
  }
}

function fmtTime(sec){ sec=Math.max(0,Math.ceil(sec)); const m=(sec/60)|0,s=sec%60; return m+':'+(s<10?'0':'')+s; }
function pauseRect(){ const s=Math.min(TOP_H*0.6,30); return {x:8,y:(TOP_H-s)/2,w:s*1.2,h:s}; }
function drawTopBar(){

  const r=pauseRect();

}
function cardRects(){
  const n=4, pad=W*0.02, top=H-HUD_H+HUD_H*0.30;
  const cw=(W-pad*(n+1))/n, ch=HUD_H-HUD_H*0.30-HUD_H*0.06, rects=[];
  for(let i=0;i<n;i++) rects.push({x:pad+i*(cw+pad),y:top,w:cw,h:ch});
  return rects;
}
function drawHUD(){
  const hy=H-HUD_H;
  ctx.fillStyle=COL.panel; ctx.fillRect(0,hy,W,HUD_H);
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(0,hy,W,2);
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font=`600 ${Math.round(HUD_H*0.09)}px system-ui`; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('Next: '+CARDS[player.pending[0]].name,W*0.02,hy+HUD_H*0.20);
  const ex=W*0.02, ew=W*0.96, ey=hy+HUD_H*0.20, eh=HUD_H*0.09, seg=ew/10;
  ctx.fillStyle='#2a1030'; rr(ctx,ex,ey,ew,eh,eh/2); ctx.fill();
  const full=Math.floor(player.elixir), frac=player.elixir-full;
  ctx.save(); rr(ctx,ex,ey,ew,eh,eh/2); ctx.clip();
  ctx.fillStyle=COL.elixir; ctx.fillRect(ex,ey,seg*full,eh);
  ctx.fillStyle=shade(COL.elixir,0.8); ctx.fillRect(ex+seg*full,ey,seg*frac,eh); ctx.restore();
  ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
  for(let i=1;i<10;i++){ ctx.beginPath(); ctx.moveTo(ex+seg*i,ey); ctx.lineTo(ex+seg*i,ey+eh); ctx.stroke(); }
  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(eh*1.1)}px system-ui`; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(Math.floor(player.elixir),ex+6,ey+eh/2);
  const rects=cardRects();
  rects.forEach((r,i)=>{
    const c=CARDS[player.hand[i]], afford=player.elixir>=c.cost, selected=(sel===i);
    ctx.save(); if(selected) ctx.translate(0,-8);
    drawCardFace(c,r,afford,selected);
    ctx.restore();
  });
}
function drawCardFace(c,r,afford,selected){
  ctx.fillStyle=afford?'#efe0b8':'#8f8a78'; rr(ctx,r.x,r.y,r.w,r.h,10); ctx.fill();

  ctx.fillStyle='rgba(0,0,0,0.18)'; rr(ctx,r.x+3,r.y+r.h*0.55,r.w-6,r.h*0.42,8); ctx.fill();

  ctx.fillStyle='#1a1a1a'; ctx.font=`bold ${Math.round(r.h*0.11)}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  wrapText(c.name,r.x+r.w/2,r.y+r.h*0.72,r.w*0.9,r.h*0.13);
  ctx.fillStyle=COL.elixir; ctx.beginPath(); ctx.arc(r.x+r.w-2,r.y+2,r.w*0.17,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(r.w*0.2)}px system-ui`; ctx.fillText(c.cost,r.x+r.w-2,r.y+2);
  if(!afford){ ctx.fillStyle='rgba(20,20,30,0.45)'; rr(ctx,r.x,r.y,r.w,r.h,10); ctx.fill(); }
  if(selected){ ctx.strokeStyle='#fff'; ctx.lineWidth=3; rr(ctx,r.x,r.y,r.w,r.h,10); ctx.stroke(); }

function wrapText(t,cx,cy,maxw,lh){
  const words=t.split(' '); let line='',lines=[];
  for(const w of words){ const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxw&&line){ lines.push(line); line=w; } else line=test; }
  if(line) lines.push(line);
  const startY=cy-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,cx,startY+i*lh));
}
function drawCardIcon(c,cx,cy,r){
  if(c.type!=='spell'){
    const s=UNIT_SPR[c.draw+'_1_0'];
    if(s){ const sc=(r*2.4)/Math.max(s.cw,s.ch);
      ctx.drawImage(s.canvas,cx-s.cw*sc/2,cy-s.ch*sc/2,s.cw*sc,s.ch*sc); return; }
  }
  ctx.save(); ctx.translate(cx,cy);
  if(c.draw==='fireball'){
    const g=ctx.createRadialGradient(0,0,r*0.1,0,0,r);
    g.addColorStop(0,'#fff'); g.addColorStop(0.5,'#ff9a3c'); g.addColorStop(1,'#c22');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
  } else if(c.draw==='jolt'){
    ctx.fillStyle='#ffe14d'; ctx.beginPath();
    ctx.moveTo(-r*0.2,-r); ctx.lineTo(r*0.4,-r*0.1); ctx.lineTo(0,-r*0.1); ctx.lineTo(r*0.2,r);
    ctx.lineTo(-r*0.4,r*0.1); ctx.lineTo(0,r*0.1); ctx.closePath(); ctx.fill();
  } else if(c.draw==='frost'){
    ctx.strokeStyle='#eaf9ff'; ctx.lineWidth=r*0.16; ctx.lineCap='round';
    for(let i=0;i<3;i++){ const a=i*Math.PI/3;
      ctx.beginPath(); ctx.moveTo(-Math.cos(a)*r,-Math.sin(a)*r); ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); ctx.stroke(); }
    ctx.fillStyle=COL.frost; ctx.beginPath(); ctx.arc(0,0,r*0.3,0,7); ctx.fill();
  } else if(c.draw==='log'){
    ctx.fillStyle=COL.woodDk; rr(ctx,-r,-r*0.5,r*2,r,r*0.45); ctx.fill();
    ctx.fillStyle=COL.wood; rr(ctx,-r*0.92,-r*0.4,r*1.84,r*0.8,r*0.38); ctx.fill();
    ctx.strokeStyle=COL.woodDk; ctx.lineWidth=r*0.12;
    for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*r*0.45,-r*0.4); ctx.lineTo(i*r*0.45,r*0.4); ctx.stroke(); }
  } else {
    ctx.fillStyle=shade(c.color,0.55); ctx.beginPath(); ctx.arc(0,0,r*0.9,0,7); ctx.fill();
    ctx.fillStyle=c.color; ctx.beginPath(); ctx.arc(0,-r*0.2,r*0.55,0,7); ctx.fill();
  }
  ctx.restore();
}

}
function drawPause(){
  ctx.fillStyle='rgba(5,8,14,0.82)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(Math.min(W,H)*0.09)}px "Trebuchet MS",system-ui`;
  ctx.fillText('PAUSED',W/2,H*0.24);
  buttons=[];
  drawButton('Resume',W/2,H*0.40,W*0.6,H*0.075,'#3a86c4',()=>{ state='playing'; refreshAudio(); });
  drawButton('Music: '+(musicOn?'On':'Off'),W/2,H*0.505,W*0.6,H*0.06,'#2a3547',()=>{ musicOn=!musicOn; refreshAudio(); });
  drawButton('Sound: '+(sfxOn?'On':'Off'),W/2,H*0.59,W*0.6,H*0.06,'#2a3547',()=>{ sfxOn=!sfxOn; });
  drawButton('Surrender',W/2,H*0.70,W*0.6,H*0.075,'#c8483f',()=>{ endMatch('defeat'); });
}
function drawOver(){
  ctx.fillStyle='rgba(5,8,14,0.8)'; ctx.fillRect(0,0,W,H);
  const win=result==='victory', draw=result==='draw';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=win?'#ffd23c':(draw?'#cfd6e0':'#ff6a5a'); ctx.font=`bold ${Math.round(Math.min(W,H)*0.11)}px "Trebuchet MS",system-ui`;
  ctx.fillText(win?'VICTORY!':(draw?'DRAW':'DEFEAT'),W/2,H*0.34);
  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(Math.min(W,H)*0.05)}px system-ui`;
  ctx.fillText(`You ♔ ${crownCount(1)}   —   ♔ ${crownCount(-1)} Foe`,W/2,H*0.44);
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font=`600 ${Math.round(Math.min(W,H)*0.032)}px system-ui`;
  ctx.fillText(`Record  ${stats.wins}W · ${stats.losses}L · ${stats.draws}D   (${AI_LEVELS[difficulty].label})`,W/2,H*0.505);
  buttons=[];
  drawButton('PLAY AGAIN',W/2,H*0.61,W*0.6,H*0.08,'#3a86c4',()=>startMatch());
  drawButton('Main menu',W/2,H*0.72,W*0.6,H*0.062,'#2a3547',()=>{state='menu';});
}

/* --------------------------- DECK BUILDER -------------------------- */
function deckRects(){
  const n=POOL.length, cols=4, rows=Math.ceil(n/cols);
  const areaTop=H*0.16, areaBot=H*0.80, pad=W*0.022;
  let cw=(W-pad*(cols+1))/cols, ch=cw*1.28;
  const maxCh=(areaBot-areaTop-pad*(rows-1))/rows;
  if(ch>maxCh){ ch=maxCh; cw=ch/1.28; }
  const gridW=cols*cw+pad*(cols-1), x0=(W-gridW)/2;
  const rects=[];
  for(let i=0;i<n;i++){
    const r=Math.floor(i/cols), c=i%cols;
    rects.push({x:x0+c*(cw+pad), y:areaTop+r*(ch+pad), w:cw, h:ch, key:POOL[i]});
  }
  return rects;
}
function toggleDeckCard(k){
  const d=stats.deck, i=d.indexOf(k);
  if(i>=0){ d.splice(i,1); deckMsg=''; }
  else if(d.length<8){ d.push(k); deckMsg=''; }
  else deckMsg='Deck is full — tap a selected card to remove it';
  saveStats();
}
function drawDeck(){
  ctx.fillStyle='rgba(5,8,14,0.96)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffd23c'; ctx.font=`bold ${Math.round(Math.min(W,H)*0.052)}px "Trebuchet MS",system-ui`;
  ctx.fillText('YOUR DECK',W/2,H*0.065);
  const full=stats.deck.length===8;
  const avg=stats.deck.length?stats.deck.reduce((s,k)=>s+CARDS[k].cost,0)/stats.deck.length:0;
  const avgCol=!stats.deck.length?'rgba(255,255,255,0.4)':(avg<3.2?'#7fe0ff':(avg>4.2?'#ff9a6a':'#4fd06a'));
  const fs=Math.round(Math.min(W,H)*0.036);
  ctx.font=`bold ${fs}px system-ui`;
  ctx.textAlign='right'; ctx.fillStyle=full?'#4fd06a':'#ffd23c';
  ctx.fillText(`${stats.deck.length} / 8`,W/2-W*0.025,H*0.115);
  ctx.textAlign='left'; ctx.fillStyle=avgCol;
  ctx.fillText(stats.deck.length?`Avg ${avg.toFixed(1)} elixir`:'Avg —',W/2+W*0.025,H*0.115);
  ctx.textAlign='center';

  const rects=deckRects();
  rects.forEach(r=>{
    const c=CARDS[r.key], on=stats.deck.indexOf(r.key)>=0;
    ctx.save();
    if(!on) ctx.globalAlpha=0.42;
    drawCardFace(c,r,true,false);
    if(c.type!=='spell'){
      const d=deployTime(c);
      const bh2=r.h*0.15, bw2=r.w*0.42;
      ctx.fillStyle='rgba(10,14,22,0.72)';
      rr(ctx,r.x+3,r.y+r.h-bh2-3,bw2,bh2,4); ctx.fill();
      ctx.fillStyle=d<=0.7?'#7fe0ff':(d>=1.1?'#ff9a6a':'#ffd23c');
      ctx.font=`bold ${Math.round(bh2*0.78)}px system-ui`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⏱'+d.toFixed(1)+'s',r.x+3+bw2/2,r.y+r.h-bh2/2-3);
    }
    ctx.restore();
    if(on){
      ctx.strokeStyle='#ffd23c'; ctx.lineWidth=3.5; rr(ctx,r.x,r.y,r.w,r.h,10); ctx.stroke();
      ctx.fillStyle='#ffd23c'; ctx.beginPath(); ctx.arc(r.x+2,r.y+2,r.w*0.17,0,7); ctx.fill();
      ctx.fillStyle='#1a1a1a'; ctx.font=`bold ${Math.round(r.w*0.19)}px system-ui`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('✓',r.x+2,r.y+3);
    }
  });
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(deckMsg){ ctx.fillStyle='#ff9a6a'; ctx.font=`600 ${Math.round(Math.min(W,H)*0.028)}px system-ui`;
    ctx.fillText(deckMsg,W/2,H*0.835); }

  buttons=[];
  drawButton('Back',W*0.19,H*0.90,W*0.30,H*0.056,'#2a3547',()=>{state='menu';});
  drawButton('Default',W*0.50,H*0.90,W*0.30,H*0.056,'#3d3350',()=>{ stats.deck=DEFAULT_DECK.slice(); deckMsg=''; saveStats(); });
  drawButton(full?'PLAY':'Pick 8',W*0.81,H*0.90,W*0.30,H*0.056,full?'#3a86c4':'#39414f',
    ()=>{ if(stats.deck.length===8) startMatch(); else deckMsg='Choose exactly 8 cards to play'; });
}

/* ------------------------------ INPUT ------------------------------ */
function evPos(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
function inRect(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
function tryDeploy(px,py){
  if(sel<0) return; const c=CARDS[player.hand[sel]];
  if(player.elixir<c.cost){ sel=-1; return; }
  const a=toArena(px,py-tile*1.6);
  if(!isValidDeploy(a.x,a.y,c)) return;
  player.elixir-=c.cost;
  const played=playFromHand(player,sel);
  spawnCard(player,played,a.x,a.y); sel=-1;
}
function onDown(e){
  e.preventDefault(); resumeAC(); const p=evPos(e);
  if(state==='deck'){
    for(const b of buttons){ if(inRect(p,b)){ b.onClick(); return; } }
    for(const r of deckRects()){ if(inRect(p,r)){ toggleDeckCard(r.key); return; } }
    return;
  }
  if(state!=='playing'){
    for(const b of buttons){ if(inRect(p,b)){ b.onClick(); return; } }
    return;
  }
  if(inRect(p,pauseRect())){ state='paused'; sel=-1; dragging=false; refreshAudio(); return; }
  const rects=cardRects();
  for(let i=0;i<rects.length;i++){ if(inRect(p,rects[i])){
    if(player.elixir>=CARDS[player.hand[i]].cost){ sel=i; dragging=true; drag=p; }
    return; } }
  if(sel>=0&&p.y<H-HUD_H){ dragging=true; drag=p; }
}
function onMove(e){ if(!dragging) return; e.preventDefault(); drag=evPos(e); }
function onUp(e){
  if(state!=='playing'||!dragging) return;
  const p=drag; dragging=false;
  if(p.y<H-HUD_H&&sel>=0) tryDeploy(p.x,p.y);
}
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove',onMove,{passive:false});
cv.addEventListener('touchend',onUp,{passive:false});
cv.addEventListener('mousedown',onDown);
cv.addEventListener('mousemove',onMove);
cv.addEventListener('mouseup',onUp);

/* ------------------------------- LOOP ------------------------------ */
function loop(ts){
  now=ts;
  let frame=(ts-last)/1000; last=ts;
  if(frame>0.25) frame=0.25; if(frame<0) frame=0;
  acc+=frame;
  let guard=0;
  while(acc>=STEP&&guard<5){ update(STEP); acc-=STEP; guard++; }
  if(acc>STEP*5) acc=0;
  render();
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));

function goBackground(){
  Music.stop();
  try{ if(AC&&AC.state==='running') AC.suspend(); }catch(e){}
  if(state==='playing') state='paused';
}
function goForeground(){
  const a=actx(); if(a&&a.state==='suspended'){ try{ a.resume(); }catch(e){} }
  refreshAudio();
}
document.addEventListener('visibilitychange',()=>{ document.hidden?goBackground():goForeground(); });
window.addEventListener('pagehide',goBackground);
window.addEventListener('blur',()=>{ if(document.hidden) goBackground(); });

loadStats();
resize();
last=performance.now();
requestAnimationFrame(loop);

})();
</script>
